<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>배움의 일생 · 관리자</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/multi.css">
</head>
<body class="admin">
  <!-- 비밀번호 -->
  <section id="gate" class="screen active">
    <div class="pad center">
      <h1 class="logo">관리자</h1>
      <input id="pw" type="password" placeholder="관리자 비밀번호">
      <button id="pwBtn" class="btn primary">들어가기</button>
      <p id="pwMsg" class="muted"></p>
    </div>
  </section>

  <!-- 관리 화면 -->
  <section id="panel" class="screen">
    <div class="pad wide">
      <div class="admin-head">
        <h1 class="logo small">배움의 일생 · 관리자</h1>
        <span id="modeTag" class="tag"></span>
      </div>
      <div class="admin-setup">
        <label>참여 조 수 <input id="groupCount" type="number" min="1" max="30" value="7"></label>
        <button id="createBtn" class="btn">새 게임 방 만들기</button>
        <button id="startAllBtn" class="btn primary">4명 모인 조 모두 시작</button>
      </div>
      <p class="muted">학생 접속 주소: <b id="joinUrl"></b></p>
      <div id="groups" class="admin-grid"></div>
    </div>
  </section>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/net.js"></script>
  <script src="data/settings.js"></script>
  <script src="data/stages.js"></script>
  <script src="data/events.js"></script>
  <script src="data/events_more.js"></script>
  <script src="data/events_random.js"></script>
  <script src="data/events_stage.js"></script>
  <script src="data/events_late.js"></script>
  <script src="data/endings.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
