<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>배움의 일생</title>
  <link href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css" rel="stylesheet">
<style>
/* 레트로 도트 테마: 두꺼운 테두리, 각진 모서리, 제한된 색 */
:root {
  --bg: #d9c39b;
  --bg2: #cdb48a;
  --paper: #fbf3e0;
  --paper2: #f3e6c8;
  --ink: #241f2e;
  --muted: #6b6478;
  --line: #241f2e;
  --accent: #3b5dc9;
  --red: #b13e53;
  --green: #2f8f5b;
  --yellow: #ffcd75;
  --radius: 0;
  --shadow: 4px 4px 0 var(--ink);
  --shadow-s: 2px 2px 0 var(--ink);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
@supports (height: 100dvh) { body { height: 100dvh; } }
body {
  /* 작은 격자무늬 배경 */
  background-color: var(--bg);
  background-image:
    linear-gradient(45deg, var(--bg2) 25%, transparent 25%, transparent 75%, var(--bg2) 75%),
    linear-gradient(45deg, var(--bg2) 25%, transparent 25%, transparent 75%, var(--bg2) 75%);
  background-size: 16px 16px;
  background-position: 0 0, 8px 8px;
  color: var(--ink);
  font-family: "Galmuri11", "Galmuri9", monospace;
  line-height: 1.65;
  -webkit-font-smoothing: none;
}
h1, h2, h3, .logo { font-family: "Galmuri14", "Galmuri11", monospace; font-weight: 400; }
img { image-rendering: pixelated; image-rendering: crisp-edges; }
.screen { display: none; height: 100%; max-width: 640px; margin: 0 auto; background: var(--paper2); border-left: 3px solid var(--ink); border-right: 3px solid var(--ink); }
.screen.active { display: flex; flex-direction: column; }

/* 버튼 */
.btn {
  font: inherit; font-weight: 700;
  border: 3px solid var(--ink); background: var(--paper); color: var(--ink);
  padding: 10px 16px; border-radius: 0; cursor: pointer; box-shadow: var(--shadow-s);
  transition: none;
}
.btn:hover { background: var(--yellow); }
.btn:active { transform: translate(2px, 2px); box-shadow: none; }
.btn.primary { background: var(--accent); color: var(--paper); }
.btn.primary:hover { background: #2f4aa6; }
.btn:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; background: var(--paper2); color: var(--muted); }

/* 그림 */
.banner-art { width: 100%; max-width: 384px; align-self: center; border: 3px solid var(--ink); box-shadow: var(--shadow); background: var(--paper); }
.sprite { width: 24px; height: 32px; }

/* 시작 */
#startScreen { justify-content: center; padding: 24px; }
.start-box { text-align: center; display: flex; flex-direction: column; gap: 14px; }
.start-box h1 { font-size: 40px; margin: 0; }
.subtitle { color: var(--muted); margin: 0 0 12px; }
#nameInput {
  font: inherit; padding: 10px 14px; border-radius: 0;
  border: 3px solid var(--ink); text-align: center; background: var(--paper);
}

/* 상단 */
.top { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 8px; background: var(--paper); border-bottom: 3px solid var(--ink); }
.who { display: flex; align-items: center; gap: 8px; font-size: 17px; flex-wrap: wrap; }
.tag { font-size: 12px; font-weight: 700; padding: 1px 8px; border: 2px solid var(--ink); background: var(--paper2); border-radius: 0; }
.age { font-family: "Galmuri14", monospace; font-size: 36px; line-height: 1; }
.age small { font-family: "Galmuri11", monospace; font-size: 14px; margin-left: 2px; color: var(--muted); }

/* 능력치 */
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 10px 16px 6px; }
.stat { background: var(--paper); border: 3px solid var(--ink); border-radius: 0; padding: 6px 10px; position: relative; box-shadow: var(--shadow-s); }
.stat .name { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; align-items: baseline; }
.stat .name b { color: var(--ink); font-family: "Galmuri14", monospace; font-size: 18px; font-weight: 400; }
.stat .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
.stat .bar { height: 6px; background: var(--paper2); margin-top: 6px; }
.stat .fill { height: 100%; }
.float {
  position: absolute; right: 8px; top: -10px; font-size: 13px; font-weight: 700;
  animation: floatUp 1.4s steps(6) forwards; pointer-events: none;
}
@keyframes floatUp { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-18px); } }

/* 인생 진행 막대 */
.timeline-bar { display: flex; gap: 0; margin: 4px 16px 8px; border: 2px solid var(--ink); }
.timeline-bar div { flex: 1; height: 8px; background: var(--paper); border-right: 2px solid var(--ink); }
.timeline-bar div:last-child { border-right: 0; }

/* 기록 */
.log { flex: 1; overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 6px; }
.entry { display: flex; gap: 10px; font-size: 14px; animation: fadeIn .3s steps(3); }
.entry .y { min-width: 44px; color: var(--muted); font-size: 12px; padding-top: 3px; text-align: right; }
.entry.stage { margin-top: 10px; font-family: "Galmuri14", monospace; }
.entry.event .t { background: var(--paper); border: 2px solid var(--ink); padding: 5px 9px; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.controls { display: flex; gap: 8px; padding: 10px 16px 18px; background: var(--paper); border-top: 3px solid var(--ink); }
.controls .btn { flex: 1; white-space: nowrap; }

/* 이벤트 창 */
.modal {
  position: fixed; inset: 0; background: rgba(36, 31, 46, .6);
  display: none; align-items: center; justify-content: center; padding: 12px; z-index: 10;
}
.modal.open { display: flex; }
.card {
  background: var(--paper); border: 3px solid var(--ink); border-radius: 0; width: 100%; max-width: 520px;
  max-height: 94vh; overflow-y: auto; padding: 16px; box-shadow: 6px 6px 0 var(--ink); animation: pop .2s steps(2);
}
@keyframes pop { from { transform: translateY(8px); } to { transform: none; } }
.card-head { display: flex; justify-content: space-between; align-items: center; }
.ev-age { color: var(--muted); font-size: 13px; }
.card h2 { margin: 8px 0; font-size: 21px; }
.ev-image { width: 100%; max-height: 30vh; object-fit: cover; border: 3px solid var(--ink); margin-bottom: 10px; display: none; background: var(--paper2); }
.ev-text { white-space: pre-line; margin: 0 0 14px; font-size: 15px; }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choices .btn { text-align: left; font-weight: 400; }
.choices .btn::before { content: "▸ "; color: var(--accent); }
.result { display: none; }
.deltas { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.deltas span { font-size: 13px; font-weight: 700; padding: 2px 8px; border: 2px solid var(--ink); background: var(--paper2); }
.info { background: #e3ecd9; border: 2px dashed var(--ink); padding: 10px 12px; margin-bottom: 14px; font-size: 13px; }
.info p { white-space: pre-line; margin: 6px 0 0; }
#evContinue { width: 100%; }

/* 교육 멘토링 */
.card.mentor { background: #fff4d6; border-color: #7a5200; box-shadow: 6px 6px 0 #7a5200; }
.card.mentor h2 { color: #8a5a00; }

/* 엔딩 */
#endScreen { overflow-y: auto; }
.end-box { padding: 28px 16px; text-align: center; }
.end-label { color: var(--muted); margin: 0; }
.end-box h2 { font-size: 30px; margin: 4px 0 12px; }
.end-text { white-space: pre-line; }
.end-box h3 { margin-top: 24px; }
.edu-list { list-style: none; padding: 0; text-align: left; margin-bottom: 24px; }
.edu-list li { background: var(--paper); border: 2px solid var(--ink); padding: 6px 10px; margin-bottom: 6px; font-size: 14px; }
.edu-list li small { color: var(--muted); margin-right: 8px; }
.edu-list li.plain { opacity: .6; }

@media (max-width: 420px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .start-box h1 { font-size: 32px; }
  .age { font-size: 30px; }
}
</style>
<style>
/* 조별 멀티플레이 화면 (레트로 테마) */
.pad { padding: 24px 16px; display: flex; flex-direction: column; gap: 12px; }
.pad.wide { max-width: 1200px; margin: 0 auto; }
.screen:has(.pad.wide) { max-width: none; border: 0; background: transparent; }
.center { text-align: center; align-items: center; }
.muted { color: var(--muted); font-size: 14px; }
.logo { font-size: 34px; margin: 0; text-align: center; text-shadow: 3px 3px 0 var(--yellow); }
.logo.small { font-size: 22px; text-align: left; }
.link { background: none; border: 0; color: var(--muted); font: inherit; cursor: pointer; padding: 4px 0; align-self: flex-start; text-decoration: underline; }
#playerName, #pw, #groupCount {
  font: inherit; padding: 10px 14px; border-radius: 0; border: 3px solid var(--ink); background: var(--paper);
}
#groupCount { width: 80px; padding: 6px 10px; }

.group-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.group-btn, .seat {
  font: inherit; border: 3px solid var(--ink); background: var(--paper); border-radius: 0; box-shadow: var(--shadow-s);
  padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; color: var(--ink);
}
.group-btn:hover:not(:disabled), .seat:hover:not(:disabled) { background: var(--yellow); }
.group-btn:active:not(:disabled), .seat:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: none; }
.group-btn b { font-family: "Galmuri14", monospace; font-size: 20px; font-weight: 400; }
.group-btn small, .seat small { color: var(--muted); }
.group-btn:disabled, .seat:disabled { opacity: .5; cursor: default; box-shadow: none; }
.seat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.seat.parent { border-bottom: 6px solid #ef7d57; }
.seat.child { border-bottom: 6px solid #41a6f6; }
.seat.on.parent { background: #fbd9c2; }
.seat.on.child { background: #cfe6f5; }

/* 게임 화면 */
.ages { display: flex; align-items: flex-end; gap: 12px; }
.age small:first-child { font-size: 12px; margin-right: 4px; }
.sub-age { font-size: 22px; color: var(--muted); }
.tag.me { background: #cfe6f5; }
.stats { grid-template-columns: repeat(3, 1fr); }
.entry.by-parent .t { border-left: 6px solid #ef7d57; }
.status-line { padding: 4px 16px; font-size: 12px; color: var(--muted); }
.btn.picked { background: #cfe6f5; border-color: var(--accent); }
.badge { display: inline-block; font-size: 11px; background: var(--accent); color: var(--paper); border: 2px solid var(--ink); padding: 0 6px; margin-left: 4px; }
.ev-msg { font-size: 14px; color: var(--red); margin: 10px 0 0; min-height: 1em; }

/* 관리자 */
.admin-head { display: flex; justify-content: space-between; align-items: center; }
.admin-setup { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.admin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.admin-card { background: var(--paper); border: 3px solid var(--ink); box-shadow: var(--shadow); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.admin-card-head { display: flex; gap: 8px; align-items: center; }
.admin-card-head b { font-family: "Galmuri14", monospace; font-size: 20px; font-weight: 400; }
.admin-card-head .tag { margin-left: auto; }
.seats-row { display: flex; flex-wrap: wrap; gap: 4px; }
.mini-seat { font-size: 12px; padding: 0 6px; border: 2px solid var(--ink); background: var(--paper2); color: var(--muted); }
.mini-seat.on { background: #c9e8c4; color: var(--ink); }
.nums { display: flex; flex-wrap: wrap; gap: 10px; font-size: 14px; }
.pend { background: var(--paper2); border: 2px dashed var(--ink); padding: 6px 10px; font-size: 14px; }
.mini-log { margin: 0; padding-left: 18px; font-size: 13px; color: var(--muted); }

@media (max-width: 420px) { .stats { grid-template-columns: repeat(3, 1fr); } .stat .name { flex-direction: column; } }

/* 기록은 매번 다시 그리므로 등장 애니메이션 끔 */
.log .entry { animation: none; }
.admin-card-head .tag.cls-tag { margin-left: 0; background: #e2d3f0; }
.subtitle { text-align: center; }

/* ───────── 연도 ───────── */
.year-box { font-family: "Galmuri14", monospace; font-size: 20px; line-height: 1; padding: 3px 6px; border: 2px solid var(--ink); background: var(--ink); color: var(--yellow); }
.year-box small { font-size: 11px; color: var(--paper); margin-left: 1px; }

/* ───────── 뉴스 관련 표시 ───────── */
.entry.news .t { background: #2a0d12; color: #fff; border: 2px solid #e8202a; padding: 5px 9px; font-weight: 700; }
.entry.news .y { color: #c0182a; font-weight: 700; }
.news-wait { color: #fff; background: #c0182a; border: 2px solid var(--ink); padding: 4px 8px; font-weight: 700; animation: bkBlink 1s steps(2) infinite; }
.btn.news-wait-btn:disabled { background: #2a0d12; color: #ffcd75; opacity: 1; }
.deltas .news-delta { background: #2a0d12; color: #ffcd75; border-color: #e8202a; }
.motive { text-align: left; }
.motive-bar { display: flex; height: 22px; border: 3px solid var(--ink); background: var(--paper2); }
.motive-bar .ext { background: #ef7d57; }
.motive-bar .int { background: #41a6f6; }
.motive-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; margin-top: 6px; }
.motive-legend .ext { color: #b4532f; } .motive-legend .int { color: #2a6fb0; }
.news-list li { border-left: 6px solid #e8202a; }

/* ───────── 브레이킹 뉴스 배너 ───────── */
.breaking {
  position: fixed; inset: 0; z-index: 100; display: none; flex-direction: column;
  background: #120a0e;
  background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 2px, transparent 2px 4px);
  color: #fff; overflow: hidden;
}
.breaking.open { display: flex; }
.bk-flash { position: absolute; inset: 0; background: #ff1e2d; pointer-events: none; opacity: 0; }
.breaking.open .bk-flash { animation: bkFlash .9s steps(1) 1; }
@keyframes bkFlash { 0%, 33%, 66% { opacity: .85; } 16%, 50%, 83%, 100% { opacity: 0; } }
.bk-stripes {
  height: 18px; flex: none;
  background: repeating-linear-gradient(-45deg, #e8202a 0 14px, #120a0e 14px 28px);
  background-size: 40px 40px; animation: bkStripe 1s linear infinite;
  border-top: 3px solid #000; border-bottom: 3px solid #000;
}
.bk-stripes.bottom { animation-direction: reverse; }
@keyframes bkStripe { to { background-position: 40px 0; } }
.bk-box {
  flex: 1; overflow-y: auto; width: 100%; max-width: 580px; margin: 0 auto; padding: 14px 16px 64px;
  display: flex; flex-direction: column; gap: 10px;
}
.breaking.open .bk-box { animation: bkShake .5s steps(2) 1; }
@keyframes bkShake { 0% { transform: translate(-6px, 3px); } 25% { transform: translate(6px, -3px); } 50% { transform: translate(-4px, 2px); } 75% { transform: translate(4px, 0); } 100% { transform: none; } }
.bk-top { display: flex; align-items: stretch; gap: 0; border: 3px solid #000; box-shadow: 4px 4px 0 #000; }
.bk-label {
  font-family: "Galmuri14", monospace; font-size: 26px; background: #e8202a; color: #fff;
  padding: 4px 14px; display: flex; align-items: center; gap: 8px;
}
.bk-dot { width: 12px; height: 12px; background: #fff; animation: bkBlink .6s steps(2) infinite; }
.bk-en {
  flex: 1; font-family: "Galmuri11", monospace; font-weight: 700; font-size: 18px; letter-spacing: 3px;
  background: #fff; color: #c0182a; display: flex; align-items: center; padding: 0 12px;
}
.bk-live { background: #000; color: #ff3344; font-weight: 700; padding: 0 10px; display: flex; align-items: center; animation: bkBlink 1s steps(2) infinite; }
@keyframes bkBlink { 50% { opacity: .25; } }
.bk-art { width: 100%; max-height: 24vh; object-fit: cover; border: 3px solid #e8202a; image-rendering: pixelated; }
.bk-date { color: #ffcd75; font-size: 14px; font-weight: 700; letter-spacing: 1px; }
.bk-head {
  margin: 0; font-family: "Galmuri14", monospace; font-weight: 400; font-size: 27px; line-height: 1.35;
  background: #e8202a; color: #fff; padding: 10px 14px; border: 3px solid #000; box-shadow: 6px 6px 0 #000;
  text-shadow: 2px 2px 0 #7a0010;
}
.bk-changes-title { color: #ff8a92; font-size: 13px; font-weight: 700; margin-top: 4px; }
.bk-changes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.bk-changes li { background: #26141a; border-left: 6px solid #ffcd75; padding: 6px 10px; font-size: 15px; }
.bk-changes li::before { content: "▶ "; color: #ffcd75; }
.bk-shock { background: #ffcd75; color: #241f2e; border: 3px solid #000; padding: 8px 12px; font-weight: 700; box-shadow: 4px 4px 0 #000; }
.bk-btn { background: #ffcd75; color: #241f2e; border-color: #000; box-shadow: 4px 4px 0 #000; font-size: 17px; }
.bk-btn:hover { background: #fff; }
.bk-wait { text-align: center; color: #ffcd75; margin: 4px 0 0; animation: bkBlink 1.2s steps(2) infinite; }
.breaking.live .bk-box { border-left: 4px solid #e8202a; border-right: 4px solid #e8202a; }
.bk-ticker {
  position: absolute; left: 0; right: 0; bottom: 0; height: 44px; display: flex; align-items: stretch;
  background: #c0182a; border-top: 3px solid #000; font-weight: 700;
}
.bk-tk-label { background: #ffcd75; color: #241f2e; padding: 0 14px; display: flex; align-items: center; font-family: "Galmuri14", monospace; font-size: 18px; border-right: 3px solid #000; flex: none; }
.bk-tk-track { flex: 1; overflow: hidden; display: flex; align-items: center; }
.bk-tk-text { white-space: nowrap; font-size: 17px; color: #fff; animation: bkTicker 26s linear infinite; padding-left: 100%; }
@keyframes bkTicker { from { transform: translateX(0); } to { transform: translateX(-100%); } }
@media (max-width: 420px) { .bk-head { font-size: 22px; } .bk-label { font-size: 20px; } .bk-en { font-size: 13px; letter-spacing: 1px; } }

/* ───────── 관리자: 뉴스·결과 비교 ───────── */
.admin-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.admin-tabs .btn.on { background: var(--ink); color: var(--yellow); }
.news-panel { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.news-slot { background: #26141a; color: #fff; border: 3px solid var(--ink); box-shadow: var(--shadow-s); padding: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.news-slot b { color: #ffcd75; }
.news-slot.done { opacity: .6; }
.news-slot.on { border-color: #e8202a; animation: bkBlink 1s steps(2) infinite; }
.news-slot .btn { padding: 6px 10px; font-size: 13px; }
.btn.red { background: #e8202a; color: #fff; }
.compare { display: flex; flex-direction: column; gap: 16px; }
.compare-chart { background: var(--paper); border: 3px solid var(--ink); box-shadow: var(--shadow); padding: 10px; }
.compare-chart svg { width: 100%; height: auto; display: block; }
.compare-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; margin-top: 6px; }
.compare-table-wrap { overflow-x: auto; border: 3px solid var(--ink); box-shadow: var(--shadow); background: var(--paper); }
.compare-table { border-collapse: collapse; width: 100%; font-size: 13px; min-width: 900px; }
.compare-table th, .compare-table td { border: 2px solid var(--ink); padding: 6px 8px; vertical-align: top; text-align: left; }
.compare-table th { background: var(--ink); color: var(--yellow); font-weight: 400; font-family: "Galmuri14", monospace; }
.compare-table .num { text-align: right; white-space: nowrap; }
.mini-motive { display: flex; height: 10px; width: 90px; border: 2px solid var(--ink); margin-top: 3px; }
.mini-motive .ext { background: #ef7d57; } .mini-motive .int { background: #41a6f6; }
.discuss { background: #fff4d6; border: 3px solid #7a5200; box-shadow: 4px 4px 0 #7a5200; padding: 12px 16px; }
.discuss h3 { margin: 0 0 6px; }
.discuss ol { margin: 0; padding-left: 22px; font-size: 16px; line-height: 1.8; }

/* ───────── 앵커 화면 ───────── */
body.anchor-page { background: #120a0e; background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 2px, transparent 2px 4px); }
.anchor-page .screen { max-width: 760px; background: #1c1015; border-color: #000; color: #fff; }
.anchor-page .muted { color: #c9a9b0; }
.anchor-page .logo { text-shadow: 3px 3px 0 #e8202a; color: #fff; }
.anchor-head { display: flex; align-items: stretch; border: 3px solid #000; box-shadow: 4px 4px 0 #000; background: #fff; color: #c0182a; }
.anchor-head b { flex: 1; display: flex; align-items: center; padding: 0 12px; font-family: "Galmuri14", monospace; font-weight: 400; font-size: 20px; }
.on-air { background: #333; color: #999; padding: 0 12px; display: flex; align-items: center; font-weight: 700; }
.on-air.live { background: #e8202a; color: #fff; animation: bkBlink 1s steps(2) infinite; }
.slot-list { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.slot-btn { font: inherit; color: #fff; background: #26141a; border: 3px solid #000; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; cursor: pointer; }

    웰다잉: "elder",
  };
  const STAGE_SCENE = { 영유아: "home", 청소년: "school", 대학생: "university", 성인: "office", 중장년: "center", 노년: "elder" };

  const cache = {};
  function draw(w, h, fn) {
    const cv = document.createElement("canvas"); cv.width = w * SCALE; cv.height = h * SCALE;
    x0 = cv.getContext("2d"); x0.imageSmoothingEnabled = false; x0.setTransform(SCALE, 0, 0, SCALE, 0, 0); fn(); return cv.toDataURL();
  }
  function scene(name) {
    if (!SCENES[name]) name = "home";
    return cache[name] || (cache[name] = draw(W, H, SCENES[name]));
  }
  // 이벤트 그림 주소 (ev.image가 있으면 그것)
  function forEvent(ev, stageId, mentor) {
    if (mentor) return scene("mentor");
    if (ev && ev.image) return ev.image;
    return scene((ev && (ev.scene || SCENE_OF[ev.id])) || STAGE_SCENE[stageId] || "home");
  }
  // 시기별 캐릭터 (작은 아이콘)
  const KIND = {
    영유아: { kind: "kid", shirt: "sun" }, 청소년: { kind: "teen", shirt: "blue", bag: "red" },
    대학생: { kind: "adult", shirt: "green", bag: "ink2" }, 성인: { kind: "adult", shirt: "cream", tie: "red" },
    중장년: { kind: "adult", shirt: "purple", hair: "gray" }, 노년: { kind: "elder", shirt: "teal" },
  };
  function sprite(stageId, extra) {
    const key = "s_" + stageId + (extra ? JSON.stringify(extra) : "");
    if (cache[key]) return cache[key];
    const o = Object.assign({}, KIND[stageId] || KIND.성인, extra || {});
    return (cache[key] = draw(12, 16, () => person(o.kind === "kid" ? 4 : 3, 16, o)));
  }
  return { scene, forEvent, sprite, C };
})();

// 첫 화면 그림
(() => { const el = document.getElementById("lobbyArt"); if (el) el.src = Pixel.scene("home"); })();
</script>
<script>
// 게임 엔진: 데이터(data 폴더)를 읽어 게임을 진행한다
(() => {
  const $ = (id) => document.getElementById(id);
  const S = {}; // 현재 게임 상태
  let bgm = null;

  // ── 유틸 ──
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const clamp = (v) => Math.max(0, Math.round(v)); // 자산은 0 아래로 내려가지 않음

  // 좋은 교육 종류 수 (같은 이름은 한 번만)
  const goodEduCount = () => new Set(S.edu.filter((e) => e.good).map((e) => e.name)).size;

  // 자산에 따른 운 배율: 자산이 많을수록 좋은 일은 더 자주, 나쁜 일은 덜 자주
  function luck() {
    const L = SETTINGS.luck;
    return Math.max(L.min, Math.min(L.max, Math.sqrt((S.stats.자산 || 0) / L.base)));
  }
  // good: true(좋은 일) / false(나쁜 일) / 없음(보통). 없으면 자산 변화로 판단
  function toneOf(o) {
    if (o.good === true || o.good === false) return o.good;
    const a = (o.effects || {}).자산;
    return a > 0 ? true : a < 0 ? false : null;
  }
  const weighted = (p, tone) => tone === true ? p * luck() : tone === false ? p / luck() : p;
  const stageOf = (age) => STAGES.find((s) => age >= s.from && age <= s.to) || STAGES[STAGES.length - 1];

  // {이름}과 조사 처리: {이름}이(가), 은(는), 을(를), 과(와), 아(야), 으로(로)
  function fill(text) {
    const name = S.name || "";
    const last = name.charCodeAt(name.length - 1);
    const hasBatchim = last >= 0xac00 && last <= 0xd7a3 && (last - 0xac00) % 28 !== 0;
    const josa = { "이(가)": ["이", "가"], "은(는)": ["은", "는"], "을(를)": ["을", "를"],
      "과(와)": ["과", "와"], "아(야)": ["아", "야"], "으로(로)": ["으로", "로"] };
    return (text || "")
      .replace(/\{이름\}(이\(가\)|은\(는\)|을\(를\)|과\(와\)|아\(야\)|으로\(로\))/g,
        (_, j) => name + josa[j][hasBatchim ? 0 : 1])
      .replace(/\{이름\}/g, name);
  }

  // 조건 검사: { min:{지식:50}, max:{...}, flags:[...], notFlags:[...], eduCount:3 }
  function meets(req) {
    if (!req) return true;
    for (const k in req.min || {}) if (S.stats[k] < req.min[k]) return false;
    for (const k in req.max || {}) if (S.stats[k] > req.max[k]) return false;
    for (const f of req.flags || []) if (!S.flags[f]) return false;
    for (const f of req.notFlags || []) if (S.flags[f]) return false;
    if (req.eduCount && S.edu.length < req.eduCount) return false;
    if (req.goodEdu && goodEduCount() < req.goodEdu) return false;
    if (req.maxGoodEdu != null && goodEduCount() > req.maxGoodEdu) return false;
    for (const f of req.world || []) if (!S.world[f]) return false;
    for (const f of req.notWorld || []) if (S.world[f]) return false;
    return true;
  }

  // ── 브레이킹 뉴스 (혼자하기: 그 나이가 되면 자동 송출) ──
  const hasNews = () => typeof NEWS !== "undefined";
  const newsPick = (k) => NEWS.slots[k][NEWS.fixed ? NEWS.fixed[k] : Math.floor(Math.random() * NEWS.slots[k].length)];
  const worldItem = (id) => { if (!hasNews()) return null; for (const s of NEWS.slots) for (const n of s) if (n.id === id) return n; return null; };
  // 뉴스 데이터는 조별 게임 모양(G, ch)을 기대하므로 맞춰 준다
  function ctx() {
    const ch = { name: S.name, age: S.age, flags: S.flags, edu: S.edu };
    return { ch, G: { asset: S.stats.자산, world: S.world, cls: S.cls && S.cls.name, chars: { child: ch, parent: ch } } };
  }
  function worldMods(ev, c, base) {
    let add = 0; const notes = []; const { G, ch } = ctx();
    for (const id in S.world) for (const m of (worldItem(id) || {}).mods || []) {
      if (!m.test(ev, c, ch, G)) continue;
      const a = typeof m.asset === "function" ? m.asset(base) : m.asset;
      if (a) { add += a; notes.push(m.note); }
    }
    return { add, notes };
  }
  // 이 나이에 뉴스가 있으면 발표하고 true
  function airNews(age) {
    if (!hasNews()) return false;
    const k = NEWS.ages.indexOf(age);
    if (k < 0 || S.newsSeen[k]) return false;
    const item = newsPick(k);
    S.newsSeen[k] = item.id; S.world[item.id] = true;
    log(`📰 ${NEWS.birthYear + age}년 속보: ${item.headline}`, "news", age);
    let shockTxt = "";
    const sh = item.shock ? item.shock(ctx().G) : null;
    if (sh && sh.asset) {
      const before = S.stats.자산;
      S.stats.자산 = clamp(before + sh.asset);
      shockTxt = `${S.name}에게 온 변화 → 자산 ${sh.asset > 0 ? "+" : ""}${S.stats.자산 - before} (${sh.note})`;
      log(`📰 뉴스 영향: 자산 ${sh.asset > 0 ? "+" : ""}${S.stats.자산 - before} (${sh.note})`, "news", age);
      renderStats("stats", { 자산: S.stats.자산 - before });
    }
    if (window.Breaking) {
      S.busy = true;
      Breaking.show(item, k, { live: false, shock: shockTxt, onClose: () => { S.busy = false; } });
    }
    return true;
  }

  function playSound(src) {
    if (!src) return;
    try { new Audio(src).play(); } catch (e) {}
  }

  // ── 화면 ──
  function show(id) {
    document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active"));
    $(id).classList.add("active");
  }

  function renderStats(target, withFloat = {}) {
    const box = $(target);
    box.innerHTML = "";
    const items = [
      ["자산", S.stats.자산, S.cls ? S.cls.name + " 출신" : "", withFloat.자산],
      ["받은 교육", S.edu.length + "번", "", withFloat.교육],
    ];
    for (const [k, v, sub, d] of items) {
      box.insertAdjacentHTML("beforeend", `
        <div class="stat">
          <div class="name">${k}<b>${v}</b></div>
          <div class="sub">${sub}</div>
          ${d ? `<span class="float" style="color:${d > 0 ? "#2f8f5b" : "#b13e53"}">${d > 0 ? "+" : ""}${d}</span>` : ""}
        </div>`);
    }
  }

  function renderTop() {
    const st = stageOf(S.age);
    $("ageText").textContent = S.age;
    $("nameText").textContent = S.name;
    $("stageTag").textContent = st.id;
    $("stageTag").style.background = st.color;
    // 인생 진행 막대
    const bar = $("timelineBar");
    bar.innerHTML = STAGES.map((s) =>
      `<div style="background:${S.age >= s.from ? s.color : ""}" title="${s.id}"></div>`).join("");
  }

  function log(text, type = "", age = S.age) {
    const el = document.createElement("div");
    el.className = "entry " + type;
    el.innerHTML = `<span class="y">${type === "stage" ? "" : age + "세"}</span><span class="t"></span>`;
    el.querySelector(".t").textContent = fill(text);
    $("log").appendChild(el);
    $("log").scrollTop = $("log").scrollHeight;
  }

  // ── 진행 ──
  // 소득분위 확률대로 태어날 가정을 고른다
  function pickClass() {
    const list = SETTINGS.startClasses;
    let r = Math.random() * list.reduce((a, c) => a + c.chance, 0);
    for (const c of list) { r -= c.chance; if (r < 0) return c; }
    return list[list.length - 1];
  }

  function start() {
    const cls = pickClass();
    const spread = 1 + (Math.random() * 2 - 1) * (SETTINGS.startSpread || 0);
    Object.assign(S, {
      name: $("nameInput").value.trim() || pick(SETTINGS.randomNames),
      age: 0, cls,
      stats: { 자산: Math.round(cls.asset * spread) },
      flags: {}, done: {}, edu: [],
      chanceUsed: false, world: {}, newsSeen: {},
      stage: null, busy: false,
    });
    S.startAsset = S.stats.자산;
    $("log").innerHTML = "";
    show("gameScreen");
    renderTop();
    renderStats("stats");
    S.stage = stageOf(0).id;
    log(`── ${S.stage} ──`, "stage");
    log(`{이름}이(가) ${cls.text}에서 태어났다. (${cls.name}, 자산 ${S.stats.자산})`);
    if (SETTINGS.bgm && !bgm) { bgm = new Audio(SETTINGS.bgm); bgm.loop = true; bgm.play().catch(() => {}); }
  }

  function findEvent() {
    // 나이가 딱 정해진 이벤트를 먼저, 그다음 무작위 이벤트
    const fixed = EVENTS.filter((e) => e.age != null), ranged = EVENTS.filter((e) => e.age == null);
    return [...fixed, ...ranged].find((e) => {
      if (S.done[e.id]) return false;
      const ageOk = e.age != null ? e.age === S.age
        : e.ages ? S.age >= e.ages[0] && S.age <= e.ages[1] : false;
      if (!ageOk || !meets(e.requires)) return false;
      return e.chance == null || Math.random() < weighted(e.chance, toneOf(e));
    });
  }

  // 1년 진행(화면에는 보이지 않음). 이벤트가 열리면 true 반환
  function nextYear() {
    if (S.busy) return true;
    if (S.age >= SETTINGS.maxAge) { ending(); return true; }
    if (airNews(S.age + 1)) return true; // 뉴스가 먼저, 닫은 뒤 다음 이벤트
    S.age++;
    const st = stageOf(S.age);
    if (st.id !== S.stage) { S.stage = st.id; log(`── ${st.id} ──`, "stage"); }
    renderTop();
    const ev = findEvent();
    if (ev) { openEvent(ev); return true; }
    if (S.age >= SETTINGS.maxAge) { ending(); return true; }
    return false;
  }

  function skipToEvent() {
    while (!nextYear()) {}
  }

  // ── 이벤트 ──
  function openEvent(ev) {
    S.busy = true;
    S.current = ev;
    S.done[ev.id] = true;
    const st = stageOf(S.age);
    $("evStage").textContent = st.id;
    $("evStage").style.background = st.color;
    $("evAge").textContent = S.age + "세";
    $("evTitle").textContent = fill(ev.title);
    $("evText").textContent = fill(ev.text);
    $("eventModal").querySelector(".card").classList.remove("mentor");
    const img = $("evImage");
    const pic = window.Pixel ? Pixel.forEvent(ev, st.id) : ev.image;
    if (pic) { img.src = pic; img.style.display = "block"; } else img.style.display = "none";
    playSound(ev.sound);

    const box = $("evChoices");
    box.innerHTML = "";
    box.style.display = "flex";
    $("evResult").style.display = "none";
    const list = ev.choices.filter((c) => meets(c.requires));

    if (window.Glossary) $("evText").innerHTML = Glossary.mark(fill(ev.text));

    // Help: 한 번만, 최고 선택이 정해진 이벤트에서만(뉴스가 최고 선택을 바꿨으면 그걸로), 인생 양끝 구간 제외
    let swap = null;
    for (const id in S.world) { const n = worldItem(id); if (n && n.mentor && n.mentor[ev.id]) swap = n.mentor[ev.id]; }
    const best = (swap && list.find((c) => c.text.includes(swap.pick))) || list.find((c) => c.mentor);
    const M = SETTINGS.mentoring;
    const edge = SETTINGS.maxAge * (M?.edge ?? 0);
    const chanceOk = !!best && S.age >= edge && S.age <= SETTINGS.maxAge - edge;
    S.chance = chanceOk ? { c: best, swap: swap && best.text.includes(swap.pick) ? swap : null } : null;

    // 선택지 순서는 매번 섞는다
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }
    const costOf = (c) => -((c.effects || {}).자산 || 0);
    // 모든 선택지가 돈이 모자라면(피할 수 없는 손실) 잠그지 않는다
    const canLock = list.some((c) => costOf(c) <= S.stats.자산);
    const open = [];
    list.forEach((c) => {
      const b = document.createElement("button");
      b.className = "btn";
      const cost = costOf(c);
      b.textContent = fill(c.text);
      if (canLock && cost > 0 && S.stats.자산 < cost) {
        // 돈이 모자라면 고를 수 없다
        b.disabled = true;
        b.textContent += ` (자산 ${cost} 필요)`;
      } else { b.onclick = () => choose(c); open.push(c); }
      // 투자처럼 결과가 운에 따라 갈리는 선택지는 확률을 보여 준다(자산 반영)
      if (c.outcomes) {
        const ws = c.outcomes.map((o) => weighted(o.chance, toneOf(o))), sum = ws.reduce((a, x) => a + x, 0) || 1;
        b.insertAdjacentHTML("beforeend", `<small class="odds">🎲 ${c.outcomes.map((o, k) => `${toneOf(o) === false ? "실패" : "성공"} ${Math.round((ws[k] / sum) * 100)}%`).join(" / ")}</small>`);
      }
      box.appendChild(b);
    });
    // Help 버튼
    const cb = document.createElement("button");
    cb.className = "btn chance";
    cb.innerHTML = `💡 Help <small>${S.chanceUsed ? "(이미 사용함)" : S.chance ? "(일생에 1번)" : "(이 상황에선 쓸 수 없어요)"}</small>`;
    if (S.chanceUsed || !S.chance) cb.disabled = true;
    else cb.onclick = () => { S.chanceUsed = true; choose(S.chance.c, true); };
    box.appendChild(cb);
    // 선택 제한시간: 끝나면 고를 수 있는 선택지 중 무작위
    startTimer(() => choose(pick(open.length ? open : list), false, true));
    $("eventModal").classList.add("open");
  }

  // ── 선택 제한시간 ──
  let timer = null;
  function startTimer(onEnd) {
    stopTimer();
    const sec = SETTINGS.soloChoiceSeconds;
    let tm = $("evTimer");
    if (!tm) { tm = document.createElement("div"); tm.id = "evTimer"; tm.className = "ev-timer"; tm.innerHTML = "<i></i><span></span>"; $("evChoices").before(tm); }
    tm.style.display = sec ? "" : "none";
    if (!sec) return;
    const t0 = Date.now(), lim = sec * 1000;
    const tick = () => {
      const left = Math.max(0, lim - (Date.now() - t0));
      tm.querySelector("i").style.width = (left / lim) * 100 + "%";
      tm.querySelector("span").textContent = `⏰ ${Math.ceil(left / 1000)}초`;
      tm.classList.toggle("hurry", left < 10000);
      if (left <= 0) { stopTimer(); onEnd(); }
    };
    tick();
    timer = setInterval(tick, 500);
  }
  function stopTimer() { clearInterval(timer); timer = null; const tm = $("evTimer"); if (tm) tm.style.display = "none"; }

  function choose(c, mentored = false, timedOut = false) {
    stopTimer();
    // 확률 결과가 있으면 하나를 고른다
    let out = c;
    if (mentored) {
      // Help: 가장 좋은 선택을 한 것으로 하고 찬스 결과를 적용 (뉴스가 바꾼 최고 선택이면 그 결과)
      const m = (S.chance && S.chance.swap) || c.mentor || {};
      out = { ...c, effects: m.effects || c.effects, result: m.result || c.result };
      $("evText").textContent = `💡 Help로 고른 선택: "${fill(c.text)}"`;
    } else if (c.outcomes) {
      // 자산이 많을수록 좋은 결과 쪽으로 확률이 기운다
      const ws = c.outcomes.map((o) => weighted(o.chance, toneOf(o)));
      let r = Math.random() * ws.reduce((a, b) => a + b, 0);
      out = c.outcomes[c.outcomes.length - 1];
      for (let i = 0; i < ws.length; i++) { r -= ws[i]; if (r < 0) { out = c.outcomes[i]; break; } }
    }
    if (timedOut) $("evText").textContent = `⏰ 시간 초과로 자동 결정: "${fill(c.text)}"`;
    const effects = { ...(out.effects || {}) };
    // 뉴스가 바꾼 세상의 추가 효과
    const wm = worldMods(S.current, c, effects.자산 || 0);
    if (wm.add) effects.자산 = (effects.자산 || 0) + wm.add;
    const applied = {};
    for (const k in effects) {
      const before = S.stats[k];
      S.stats[k] = clamp(before + effects[k]);
      applied[k] = S.stats[k] - before;
    }
    for (const f of [].concat(c.flags || [], out.flags || [])) S.flags[f] = true;
    const eduName = out.edu !== undefined ? out.edu : c.edu;
    const eduGood = (out.eduGood !== undefined ? out.eduGood : c.eduGood) !== false;
    if (eduName) { S.edu.push({ age: S.age, name: fill(eduName), good: eduGood }); applied.교육 = 1; }

    log(`${mentored ? "💡 Help · " : ""}${fill(S.current.title)} → ${fill(c.text)}`, "event");
    renderStats("stats", applied);
    playSound(out.sound || c.sound);

    // 결과 표시
    const mk = (t) => (window.Glossary ? Glossary.mark(fill(t)) : fill(t));
    $("evChoices").style.display = "none";
    $("evResultText").innerHTML = mk(out.result || "");
    $("evDeltas").innerHTML = Object.entries(applied).filter(([, d]) => d)
      .map(([k, d]) => `<span style="color:${d > 0 ? "#2f8f5b" : "#b13e53"}">${k === "교육" ? "📚 교육 기회 +1" : `${k} ${d > 0 ? "+" : ""}${d}`}</span>`).join("")
      + (wm.add ? `<span class="news-delta">📰 뉴스 영향 ${wm.add > 0 ? "+" : ""}${wm.add} · ${wm.notes.join(", ")}</span>` : "");
    const info = S.current.info;
    $("evInfo").style.display = info ? "block" : "none";
    $("evInfoText").innerHTML = mk(info || "");
    $("evResult").style.display = "block";
    $("evContinue").onclick = () => closeEvent(out.next || c.next);
  }

  function closeEvent(nextId) {
    $("eventModal").classList.remove("open");
    S.busy = false;
    const next = nextId && EVENTS.find((e) => e.id === nextId);
    if (next) return openEvent(next);
    if (S.age >= SETTINGS.maxAge) ending();
  }

  // ── 엔딩 ──
  function ending() {
    S.busy = true;
    const end = ENDINGS.find((e) => meets(e.requires)) || { title: "끝", text: "" };
    $("endTitle").textContent = fill(end.title);
    $("endText").textContent = fill(end.text);
    renderStats("endStats");
    // 출발 분위 → 마지막 분위 (출발 때 쓴 10분위 자산표에서 가장 가까운 분위)
    const list = SETTINGS.startClasses, a = S.stats.자산;
    const last = list.reduce((b, c) => (Math.abs(c.asset - a) < Math.abs(b.asset - a) ? c : b), list[0]);
    $("endStats").insertAdjacentHTML("beforeend", `<div class="decile-line">🏠 출발 <b>${S.cls.name}</b> → 마지막 <b>${last.name}</b></div>`);
    $("eduList").innerHTML = S.edu.length
      ? S.edu.map((e) => `<li><small>${e.age}세</small>${e.name}</li>`).join("")
      : "<li>받은 교육이 없습니다.</li>";
    show("endScreen");
  }

  // ── 시작 ──
  document.title = SETTINGS.title;
  $("gameTitle").textContent = SETTINGS.title;
  $("gameSubtitle").textContent = SETTINGS.subtitle;
  $("startBtn").onclick = start;
  $("nameInput").onkeydown = (e) => { if (e.key === "Enter") start(); };
  $("skipBtn").onclick = skipToEvent;
  $("restartBtn").onclick = () => { show("startScreen"); $("nameInput").value = ""; };
})();
</script>
  <script>
  // 새 버전이 올라왔는데 브라우저가 예전 페이지를 기억하고 있으면, 새 페이지로 바로 바꿔 줌
  (function () {
    var m = document.documentElement.innerHTML.match(/\?v=(\d+)/); if (!m) return;
    fetch(location.pathname + "?nc=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.text(); }).then(function (t) {
      var n = (t.match(/\?v=(\d+)/) || [])[1];
      if (!n || n === m[1]) return;
      var u = new URL(location.href); if (u.searchParams.get("r") === n) return;
      u.searchParams.set("r", n); location.replace(u.toString());
    }).catch(function () {});
  })();
  </script>
</body>
