<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>배움의 일생</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f3ee;
  --paper: #ffffff;
  --ink: #2b2a28;
  --muted: #8a857c;
  --line: #e7e1d7;
  --accent: #3d5afe;
  --radius: 16px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
@supports (height: 100dvh) { body { height: 100dvh; } }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Noto Sans KR", system-ui, sans-serif;
  line-height: 1.6;
}
.screen { display: none; height: 100%; max-width: 640px; margin: 0 auto; }
.screen.active { display: flex; flex-direction: column; }

/* 버튼 */
.btn {
  font: inherit; font-weight: 500;
  border: 1px solid var(--line); background: var(--paper); color: var(--ink);
  padding: 12px 18px; border-radius: 12px; cursor: pointer;
  transition: transform .1s, background .2s;
}
.btn:hover { background: #faf8f4; }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn.primary:hover { background: #444; }
.btn:disabled { opacity: .4; cursor: default; }

/* 시작 */
#startScreen { justify-content: center; padding: 24px; }
.start-box { text-align: center; display: flex; flex-direction: column; gap: 14px; }
.start-box h1 { font-size: 44px; font-weight: 900; margin: 0; letter-spacing: -1px; }
.subtitle { color: var(--muted); margin: 0 0 20px; }
#nameInput {
  font: inherit; padding: 12px 16px; border-radius: 12px;
  border: 1px solid var(--line); text-align: center; background: var(--paper);
}

/* 상단 */
.top { display: flex; justify-content: space-between; align-items: center; padding: 20px 16px 8px; }
.who { display: flex; align-items: center; gap: 10px; font-size: 18px; }
.tag { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: #eee; }
.age { font-size: 40px; font-weight: 900; line-height: 1; }
.age small { font-size: 16px; font-weight: 500; margin-left: 2px; color: var(--muted); }

/* 능력치 */
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 8px 16px; }
.stat { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; position: relative; }
.stat .name { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
.stat .name b { color: var(--ink); font-size: 18px; }
.stat .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.card.mentor { border: 3px solid #e0a800; box-shadow: 0 0 0 6px rgba(224,168,0,.18); }
.card.mentor h2 { color: #b07d00; }
.edu-list li.plain { opacity: .6; }
.stat .bar { height: 6px; background: #f0ece5; border-radius: 99px; margin-top: 6px; overflow: hidden; }
.stat .fill { height: 100%; border-radius: 99px; transition: width .6s ease; }
.float {
  position: absolute; right: 8px; top: -6px; font-size: 12px; font-weight: 700;
  animation: floatUp 1.4s ease forwards; pointer-events: none;
}
@keyframes floatUp { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-18px); } }

/* 인생 진행 막대 */
.timeline-bar { display: flex; gap: 3px; padding: 4px 16px 8px; }
.timeline-bar div { flex: 1; height: 4px; border-radius: 99px; background: #e4ded3; transition: background .4s; }

/* 기록 */
.log { flex: 1; overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 6px; }
.entry { display: flex; gap: 12px; font-size: 15px; animation: fadeIn .4s ease; }
.entry .y { min-width: 40px; color: var(--muted); font-size: 13px; padding-top: 2px; text-align: right; }
.entry.stage { margin-top: 12px; font-weight: 700; }
.entry.event .t { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }

.controls { display: flex; gap: 8px; padding: 12px 16px 20px; }
.controls .btn { flex: 1; white-space: nowrap; }

/* 이벤트 창 */
.modal {
  position: fixed; inset: 0; background: rgba(30, 28, 24, .45);
  display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10;
}
.modal.open { display: flex; }
.card {
  background: var(--paper); border-radius: var(--radius); width: 100%; max-width: 520px;
  max-height: 92vh; overflow-y: auto; padding: 22px; animation: pop .25s ease;
}
@keyframes pop { from { transform: scale(.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.card-head { display: flex; justify-content: space-between; align-items: center; }
.ev-age { color: var(--muted); font-size: 14px; }
.card h2 { margin: 10px 0; font-size: 22px; }
.ev-image { width: 100%; border-radius: 12px; margin-bottom: 10px; display: none; }
.ev-text { white-space: pre-line; margin: 0 0 16px; }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choices .btn { text-align: left; }
.result { display: none; }
.deltas { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.deltas span { font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: #f3f0ea; }
.info { background: #f2f5ff; border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; font-size: 14px; }
.info p { white-space: pre-line; margin: 6px 0 0; }
#evContinue { width: 100%; }

/* 엔딩 */
#endScreen { overflow-y: auto; }
.end-box { padding: 32px 16px; text-align: center; }
.end-label { color: var(--muted); margin: 0; }
.end-box h2 { font-size: 32px; margin: 4px 0 12px; }
.end-text { white-space: pre-line; }
.end-box h3 { margin-top: 24px; }
.edu-list { list-style: none; padding: 0; text-align: left; margin-bottom: 24px; }
.edu-list li { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin-bottom: 6px; }
.edu-list li small { color: var(--muted); margin-right: 8px; }

@media (max-width: 420px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .start-box h1 { font-size: 36px; }
}
</style>
</head>
<body>
  <!-- 시작 화면 -->
  <section id="startScreen" class="screen active">
    <div class="start-box">
      <h1 id="gameTitle"></h1>
      <p id="gameSubtitle" class="subtitle"></p>
      <input id="nameInput" maxlength="8" placeholder="이름을 입력하세요 (비우면 무작위)">
      <button id="startBtn" class="btn primary">인생 시작하기</button>
    </div>
  </section>

  <!-- 게임 화면 -->
  <section id="gameScreen" class="screen">
    <header class="top">
      <div class="who">
        <span id="stageTag" class="tag"></span>
        <strong id="nameText"></strong>
      </div>
      <div class="age"><span id="ageText">0</span><small>세</small></div>
    </header>
    <div id="stats" class="stats"></div>
    <div id="timelineBar" class="timeline-bar"></div>
    <main id="log" class="log"></main>
    <footer class="controls">
      <button id="skipBtn" class="btn primary">▶ 다음 이벤트</button>
    </footer>
  </section>

  <!-- 엔딩 화면 -->
  <section id="endScreen" class="screen">
    <div class="end-box">
      <p class="end-label">인생의 끝에서</p>
      <h2 id="endTitle"></h2>
      <p id="endText" class="end-text"></p>
      <div id="endStats" class="stats"></div>
      <h3>나의 평생교육 이력</h3>
      <ul id="eduList" class="edu-list"></ul>
      <button id="restartBtn" class="btn primary">다시 태어나기</button>
    </div>
  </section>

  <!-- 이벤트 창 -->
  <div id="eventModal" class="modal">
    <div class="card">
      <div class="card-head">
        <span id="evStage" class="tag"></span>
        <span id="evAge" class="ev-age"></span>
      </div>
      <h2 id="evTitle"></h2>
      <img id="evImage" class="ev-image" alt="">
      <p id="evText" class="ev-text"></p>
      <div id="evChoices" class="choices"></div>
      <div id="evResult" class="result">
        <p id="evResultText" class="ev-text"></p>
        <div id="evDeltas" class="deltas"></div>
        <div id="evInfo" class="info">
          <strong>📚 평생교육 알아보기</strong>
          <p id="evInfoText"></p>
        </div>
        <button id="evContinue" class="btn primary">계속</button>
      </div>
    </div>
  </div>

  <!-- 게임 데이터: 새 스크립트 파일은 여기에 추가 -->
<script>
// 게임 기본 설정
const SETTINGS = {
  title: "배움의 일생",
  subtitle: "평생교육과 함께하는 한 사람의 80년",
  maxAge: 80,                       // 이 나이가 되면 엔딩
  stats: ["자산"],                  // 능력치는 자산 하나

  // 시작 자산: 태어난 가정의 소득분위로 정한다 (분위마다 20% 확률)
  // 금액 비율은 통계청 가계금융복지조사의 소득 5분위별 평균 자산 비율을 따름 (3분위 = 100)
  startClasses: [
    { name: "소득 1분위", chance: 0.2, asset: 40,  text: "넉넉하지 않은 집" },
    { name: "소득 2분위", chance: 0.2, asset: 70,  text: "빠듯하지만 정이 많은 집" },
    { name: "소득 3분위", chance: 0.2, asset: 100, text: "평범한 중산층 집" },
    { name: "소득 4분위", chance: 0.2, asset: 140, text: "여유가 있는 집" },
    { name: "소득 5분위", chance: 0.2, asset: 260, text: "부유한 집" },
  ],
  startSpread: 0.1,                 // 시작 자산에 ±10% 무작위 차이

  // 자산이 많을수록 좋은 일이 생길 확률이 커진다
  // 배율 = (자산 ÷ 기준)의 제곱근, 최소~최대 사이로 제한
  luck: { base: 100, min: 0.5, max: 2 },

  // 교육 멘토링(교수님 찬스): 시기마다 한 번, 그 시기의 '가장 좋은 선택'(mentor가 붙은 선택지)이 나올 때 확률 검사
  // 확률 = chance × 운 배율(자산) × repeat^(이미 나온 횟수). 한 일생에 평균 약 1번, 최대 max번
  mentoring: {
    chance: 0.2,
    repeat: 0.35,                   // 한 번 나온 뒤엔 다음 확률이 35%로 줄어듦 (2·3번은 드물게)
    max: 3,
    edge: 0.1,                      // 인생의 처음·마지막 10%(0~7세, 73~80세)에는 멘토링이 나오지 않음
    title: "🎓 교육 멘토링",
    text: `교수님 찬스가 찾아왔다!
교수님이 이 시기에 가장 좋은 선택을 직접 알려 주십니다.
교수님의 설명을 들은 뒤 '다음'을 누르세요.`,
  },

  bgm: "",                          // 예: "missing:sounds/bgm.mp3"
  randomNames: ["김하늘", "이도윤", "박서연", "최지호", "정하린", "강민준", "윤서아", "한지우"],
};

// 조별 멀티플레이 설정
SETTINGS.multi = {
  gap: 30,               // 부모와 자녀의 나이 차이
  independentAge: 30,    // 자녀가 이 나이가 되면 스스로 선택 (그 전엔 부모가 결정)
  childEnd: 60,          // 자녀가 이 나이가 되면 게임 끝
  endingScale: 0.9,      // 엔딩 기준(좋은 교육 가짓수)에 곱하는 값: 80년 기준 22·18·13 → 60년 기준 20·16·12
};

const STAGES = [];
const EVENTS = [];
const ENDINGS = [];
function addStage(s) { STAGES.push(s); }
function addEvent(e) { EVENTS.push(e); }
function addEnding(e) { ENDINGS.push(e); }
</script>
<script>
// 인생 시기 구분
// lines: 이벤트가 없는 해에 무작위로 나오는 한 줄 일기
addStage({
  id: "영유아", from: 0, to: 7, color: "#ffb3c1",
  lines: [
    "{이름}이(가) 처음으로 걸음마를 뗐다.",
    "동네 놀이터가 세상의 전부였다.",
    "그림책을 읽어 달라고 졸랐다.",
    "감기에 걸려 며칠 동안 집에만 있었다.",
  ],
});
addStage({
  id: "청소년", from: 8, to: 19, color: "#8fd3ff",
  lines: [
    "새 학년, 새 친구들을 만났다.",
    "시험 기간이라 밤늦게까지 공부했다.",
    "친구들과 노래방에서 스트레스를 풀었다.",
    "장래희망 칸을 비워 두었다.",
  ],
});
addStage({
  id: "대학생", from: 20, to: 26, color: "#a0e7a0",
  lines: [
    "수강신청 전쟁에서 살아남았다.",
    "동아리 MT를 다녀왔다.",
    "편의점 아르바이트로 용돈을 벌었다.",
    "졸업 후 진로를 고민하는 밤이 늘었다.",
  ],
});
addStage({
  id: "성인", from: 27, to: 49, color: "#ffd580",
  lines: [
    "월요일 아침 지하철은 오늘도 꽉 찼다.",
    "야근이 이어진 한 주였다.",
    "오랜만에 친구들과 저녁을 먹었다.",
    "연말 정산 결과에 웃고 울었다.",
  ],
});
addStage({
  id: "중장년", from: 50, to: 64, color: "#d4a5ff",
  lines: [
    "건강검진 결과표를 오래 들여다봤다.",
    "자녀가 독립해 집이 조용해졌다.",
    "은퇴 후의 삶을 처음으로 진지하게 생각했다.",
    "주말 등산이 새 취미가 되었다.",
  ],
});
addStage({
  id: "노년", from: 65, to: 200, color: "#c9b79c",
  lines: [
    "손주가 놀러 와 집이 북적였다.",
    "아침 산책길에 이웃과 인사를 나눴다.",
    "오래된 사진첩을 꺼내 보았다.",
    "복지관 게시판에서 새 프로그램 안내를 봤다.",
  ],
});
</script>
<script>
// 교육 이벤트 목록

    {

      edu: "일반 유치원(놀이 중심 누리과정)",

    },
    {

학원 설명회에서 강사는 말했다. "지금 시작하지 않으면 늦습니다."`,
  choices: [
    {

      effects: { 자산: -15 },
      edu: "대형 학원 선행 종합반", eduGood: false,
      result: `밤 10시에 끝나는 수업, 쏟아지는 숙제.

    },
    {
      text: "EBS 강의로 스스로 공부한다",
      effects: { 자산: -2 },
      edu: "EBS 온라인 강의 자기주도 학습",

    },
    {

  info: `신중년 사회공헌 활동 지원사업은 만 50~70세의 경력을 비영리 단체 등에 연결하고 활동 실비를 지원합니다.`,
});

// ───────── 노년 ─────────
addEvent({
  id: "금융사기",
  ages: [65, 79],
  chance: 0.06,
  good: false,
  title: "수상한 전화 한 통",
  text: `"아드님이 사고를 당했습니다. 지금 바로 합의금을 보내셔야 합니다."
떨리는 목소리로 전화를 받던 {이름}은(는) 문득 얼마 전 들은 이야기가 떠올랐다.`,
  choices: [
    { text: "경로당 금융사기 예방 교육에서 배운 대로 전화를 끊고 확인한다", edu: "노인 금융사기 예방 교육",
      result: `아들에게 직접 전화를 걸었다. 아들은 회사에서 멀쩡히 일하고 있었다.` },
    { text: "일단 돈을 보낸다", outcomes: [
        { chance: 0.3, good: true,
          result: `송금 직전 은행 직원이 이상하다며 막아 주었다.` },
        { chance: 0.7, effects: { 자산: -20 },
          result: `보이스피싱이었다. 평생 모은 돈의 일부가 한순간에 사라졌다.` },
      ] },
  ],
  info: `금융감독원과 지자체는 어르신 대상 금융사기 예방 교육을 운영합니다.
가족의 사고, 수사기관 사칭 전화를 받으면 먼저 끊고 직접 확인하는 것이 가장 확실한 예방법입니다.`,
});

addEvent({
  id: "자서전",
  age: 78,
  title: "내 인생을 글로 남긴다면",
  text: `평생학습관에서 [어르신 자서전 쓰기 교실]이 열린다.
완성된 글은 작은 책으로 엮어 준다고 한다.`,
  choices: [
    { text: "자서전 쓰기 교실에 참여한다", edu: "평생학습관 자서전 쓰기 교실",
      result: `한 문장씩 기억을 꺼내 적었다. 책을 받아 든 손주가 밤새 읽었다며 웃었다.` },
    { text: "손주에게 이야기로 들려준다",
      result: `손주는 고개를 끄덕이며 들었다. 이야기는 마음속에 남았다.` },
  ],
  info: `평생학습관과 노인복지관에서는 자서전 쓰기, 생애 기록, 회고 프로그램을 운영합니다. 삶을 돌아보는 글쓰기도 훌륭한 노년기 배움입니다.`,
});
</script>
<script>
// 엔딩 목록: 위에서부터 조건을 확인해 처음 맞는 엔딩이 나온다
// 엔딩은 자산이 아니라 '좋은 교육을 몇 가지 경험했는지'(goodEdu)로 정해진다
// 참고: 무작위로 고르면 보통 11~23가지, 교육을 꾸준히 고르면 21~26가지
addEnding({
  title: "평생 배움의 달인",
  requires: { goodEdu: 22 },
  text: `{이름}은(는) 인생의 모든 시기마다 새로운 것을 배웠다.
"배움은 끝나지 않는다"는 말은 {이름}에게 그저 사실이었다.`,
});
addEnding({
  title: "배우며 자란 삶",
  requires: { goodEdu: 18 },
  text: `넘어질 때마다 배움이 {이름}을(를) 다시 일으켜 세웠다.
주변 사람들은 고민이 생기면 {이름}을(를) 찾아왔다.`,
});
addEnding({
  title: "소박한 배움의 길",
  requires: { goodEdu: 13 },
  text: `대단한 공부는 아니었지만, 필요할 때마다 조금씩 배워 나갔다.
그 작은 배움들이 모여 {이름}의 삶이 되었다.`,
});
addEnding({
  title: "아쉬움이 남는 삶",
  requires: {},
  text: `돌아보면 놓친 배움의 기회들이 떠오른다.
그래도 {이름}은(는) 손주에게 말했다. "배우는 데는 늦은 때가 없단다."`,
});
</script>
  <!-- 게임 엔진 -->
<script>
// 게임 엔진: 데이터(data 폴더)를 읽어 게임을 진행한다
(() => {
  const $ = (id) => document.getElementById(id);
  const S = {}; // 현재 게임 상태
  let bgm = null;

  // ── 유틸 ──
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const clamp = (v) => Math.max(0, Math.round(v)); // 자산은 0 아래로 내려가지 않음

  // 좋은 교육 종류 수 (같은 이름은 한 번만)
  const goodEduCount = () => new Set(S.edu.filter((e) => e.good).map((e) => e.name)).size;

  // 자산에 따른 운 배율: 자산이 많을수록 좋은 일은 더 자주, 나쁜 일은 덜 자주
  function luck() {
    const L = SETTINGS.luck;
    return Math.max(L.min, Math.min(L.max, Math.sqrt((S.stats.자산 || 0) / L.base)));
  }
  // good: true(좋은 일) / false(나쁜 일) / 없음(보통). 없으면 자산 변화로 판단
  function toneOf(o) {
    if (o.good === true || o.good === false) return o.good;
    const a = (o.effects || {}).자산;
    return a > 0 ? true : a < 0 ? false : null;
  }
  const weighted = (p, tone) => tone === true ? p * luck() : tone === false ? p / luck() : p;
  const stageOf = (age) => STAGES.find((s) => age >= s.from && age <= s.to) || STAGES[STAGES.length - 1];

  // {이름}과 조사 처리: {이름}이(가), 은(는), 을(를), 과(와), 아(야), 으로(로)
  function fill(text) {
    const name = S.name || "";
    const last = name.charCodeAt(name.length - 1);
    const hasBatchim = last >= 0xac00 && last <= 0xd7a3 && (last - 0xac00) % 28 !== 0;
    const josa = { "이(가)": ["이", "가"], "은(는)": ["은", "는"], "을(를)": ["을", "를"],
      "과(와)": ["과", "와"], "아(야)": ["아", "야"], "으로(로)": ["으로", "로"] };
    return (text || "")
      .replace(/\{이름\}(이\(가\)|은\(는\)|을\(를\)|과\(와\)|아\(야\)|으로\(로\))/g,
        (_, j) => name + josa[j][hasBatchim ? 0 : 1])
      .replace(/\{이름\}/g, name);
  }

  // 조건 검사: { min:{지식:50}, max:{...}, flags:[...], notFlags:[...], eduCount:3 }
  function meets(req) {
    if (!req) return true;
    for (const k in req.min || {}) if (S.stats[k] < req.min[k]) return false;
    for (const k in req.max || {}) if (S.stats[k] > req.max[k]) return false;
    for (const f of req.flags || []) if (!S.flags[f]) return false;
    for (const f of req.notFlags || []) if (S.flags[f]) return false;
    if (req.eduCount && S.edu.length < req.eduCount) return false;
    if (req.goodEdu && goodEduCount() < req.goodEdu) return false;
    if (req.maxGoodEdu != null && goodEduCount() > req.maxGoodEdu) return false;
    return true;
  }

  function playSound(src) {
    if (!src) return;
    try { new Audio(src).play(); } catch (e) {}
  }

  // ── 화면 ──
  function show(id) {
    document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active"));
    $(id).classList.add("active");
  }

  function renderStats(target, withFloat = {}) {
    const box = $(target);
    box.innerHTML = "";
    const items = [
      ["자산", S.stats.자산, S.cls ? S.cls.name + " 출신" : "", withFloat.자산],
      ["받은 교육", S.edu.length + "번", "", withFloat.교육],
    ];
    for (const [k, v, sub, d] of items) {
      box.insertAdjacentHTML("beforeend", `
        <div class="stat">
          <div class="name">${k}<b>${v}</b></div>
          <div class="sub">${sub}</div>
          ${d ? `<span class="float" style="color:${d > 0 ? "#2fb47c" : "#e5484d"}">${d > 0 ? "+" : ""}${d}</span>` : ""}
        </div>`);
    }
  }

  function renderTop() {
    const st = stageOf(S.age);
    $("ageText").textContent = S.age;
    $("nameText").textContent = S.name;
    $("stageTag").textContent = st.id;
    $("stageTag").style.background = st.color;
    // 인생 진행 막대
    const bar = $("timelineBar");
    bar.innerHTML = STAGES.map((s) =>
      `<div style="background:${S.age >= s.from ? s.color : ""}" title="${s.id}"></div>`).join("");
  }

  function log(text, type = "", age = S.age) {
    const el = document.createElement("div");
    el.className = "entry " + type;
    el.innerHTML = `<span class="y">${type === "stage" ? "" : age + "세"}</span><span class="t"></span>`;
    el.querySelector(".t").textContent = fill(text);
    $("log").appendChild(el);
    $("log").scrollTop = $("log").scrollHeight;
  }

  // ── 진행 ──
  // 소득분위 확률대로 태어날 가정을 고른다
  function pickClass() {
    const list = SETTINGS.startClasses;
    let r = Math.random() * list.reduce((a, c) => a + c.chance, 0);
    for (const c of list) { r -= c.chance; if (r < 0) return c; }
    return list[list.length - 1];
  }

  function start() {
    const cls = pickClass();
    const spread = 1 + (Math.random() * 2 - 1) * (SETTINGS.startSpread || 0);
    Object.assign(S, {
      name: $("nameInput").value.trim() || pick(SETTINGS.randomNames),
      age: 0, cls,
      stats: { 자산: Math.round(cls.asset * spread) },
      flags: {}, done: {}, edu: [],
      mentorRolled: {}, mentorCount: 0,
      stage: null, busy: false,
    });
    $("log").innerHTML = "";
    show("gameScreen");
    renderTop();
    renderStats("stats");
    S.stage = stageOf(0).id;
    log(`── ${S.stage} ──`, "stage");
    log(`{이름}이(가) ${cls.text}에서 태어났다. (${cls.name}, 자산 ${S.stats.자산})`);
    if (SETTINGS.bgm && !bgm) { bgm = new Audio(SETTINGS.bgm); bgm.loop = true; bgm.play().catch(() => {}); }
  }

  function findEvent() {
    // 나이가 딱 정해진 이벤트를 먼저, 그다음 무작위 이벤트
    const fixed = EVENTS.filter((e) => e.age != null), ranged = EVENTS.filter((e) => e.age == null);
    return [...fixed, ...ranged].find((e) => {
      if (S.done[e.id]) return false;
      const ageOk = e.age != null ? e.age === S.age
        : e.ages ? S.age >= e.ages[0] && S.age <= e.ages[1] : false;
      if (!ageOk || !meets(e.requires)) return false;
      return e.chance == null || Math.random() < weighted(e.chance, toneOf(e));
    });
  }

  // 1년 진행(화면에는 보이지 않음). 이벤트가 열리면 true 반환
  function nextYear() {
    if (S.busy) return true;
    if (S.age >= SETTINGS.maxAge) { ending(); return true; }
    S.age++;
    const st = stageOf(S.age);
    if (st.id !== S.stage) { S.stage = st.id; log(`── ${st.id} ──`, "stage"); }
    renderTop();
    const ev = findEvent();
    if (ev) { openEvent(ev); return true; }
    if (S.age >= SETTINGS.maxAge) { ending(); return true; }
    return false;
  }

  function skipToEvent() {
    while (!nextYear()) {}
  }

  // ── 이벤트 ──
  function openEvent(ev) {
    S.busy = true;
    S.current = ev;
    S.done[ev.id] = true;
    const st = stageOf(S.age);
    $("evStage").textContent = st.id;
    $("evStage").style.background = st.color;
    $("evAge").textContent = S.age + "세";
    $("evTitle").textContent = fill(ev.title);
    $("evText").textContent = fill(ev.text);
    $("eventModal").querySelector(".card").classList.remove("mentor");
    const img = $("evImage");
    if (ev.image) { img.src = ev.image; img.style.display = "block"; } else img.style.display = "none";
    playSound(ev.sound);

    const box = $("evChoices");
    box.innerHTML = "";
    box.style.display = "flex";
    $("evResult").style.display = "none";
    const list = ev.choices.filter((c) => meets(c.requires));

    // 교육 멘토링: 이 시기의 가장 좋은 선택이 있는 이벤트에서 시기당 한 번 확률 검사
    const best = list.find((c) => c.mentor);
    const M = SETTINGS.mentoring;
    const edge = SETTINGS.maxAge * (M?.edge ?? 0); // 인생 양끝 구간에선 멘토링 없음
    if (best && M && S.age >= edge && S.age <= SETTINGS.maxAge - edge && !S.mentorRolled[st.id]) {
      S.mentorRolled[st.id] = true;
      const p = M.chance * luck() * Math.pow(M.repeat ?? 1, S.mentorCount);
      if (S.mentorCount < M.max && Math.random() < p) {
        S.mentorCount++;
        $("eventModal").querySelector(".card").classList.add("mentor");
        $("evTitle").textContent = M.title;
        $("evText").textContent = `${fill(M.text)}\n\n[이번 상황] ${fill(ev.title)}\n${fill(ev.text)}`;
        const b = document.createElement("button");
        b.className = "btn primary";
        b.textContent = "다음 ▶";
        b.onclick = () => choose(best, true);
        box.appendChild(b);
        $("eventModal").classList.add("open");
        return;
      }
    }

    // 선택지 순서는 매번 섞는다
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }
    const costOf = (c) => -((c.effects || {}).자산 || 0);
    // 모든 선택지가 돈이 모자라면(피할 수 없는 손실) 잠그지 않는다
    const canLock = list.some((c) => costOf(c) <= S.stats.자산);
    list.forEach((c) => {
      const b = document.createElement("button");
      b.className = "btn";
      const cost = costOf(c);
      b.textContent = fill(c.text);
      if (canLock && cost > 0 && S.stats.자산 < cost) {
        // 돈이 모자라면 고를 수 없다
        b.disabled = true;
        b.textContent += ` (자산 ${cost} 필요)`;
      } else b.onclick = () => choose(c);
      box.appendChild(b);
    });
    $("eventModal").classList.add("open");
  }

  function choose(c, mentored = false) {
    // 확률 결과가 있으면 하나를 고른다
    let out = c;
    if (mentored) {
      // 멘토링: 가장 좋은 선택을 한 것으로 하고 멘토링 결과를 적용
      out = { ...c, effects: c.mentor.effects || c.effects, result: c.mentor.result || c.result };
      $("evTitle").textContent = fill(S.current.title);
      $("evText").textContent = `🎓 교수님의 조언에 따른 선택: "${fill(c.text)}"`;
    } else if (c.outcomes) {
      // 자산이 많을수록 좋은 결과 쪽으로 확률이 기운다
      const ws = c.outcomes.map((o) => weighted(o.chance, toneOf(o)));
      let r = Math.random() * ws.reduce((a, b) => a + b, 0);
      out = c.outcomes[c.outcomes.length - 1];
      for (let i = 0; i < ws.length; i++) { r -= ws[i]; if (r < 0) { out = c.outcomes[i]; break; } }
    }
    const effects = out.effects || {};
    const applied = {};
    for (const k in effects) {
      const before = S.stats[k];
      S.stats[k] = clamp(before + effects[k]);
      applied[k] = S.stats[k] - before;
    }
    for (const f of [].concat(c.flags || [], out.flags || [])) S.flags[f] = true;
    const eduName = out.edu !== undefined ? out.edu : c.edu;
    const eduGood = (out.eduGood !== undefined ? out.eduGood : c.eduGood) !== false;
    if (eduName) { S.edu.push({ age: S.age, name: fill(eduName), good: eduGood }); applied.교육 = 1; }

    log(`${mentored ? "🎓 교육 멘토링 · " : ""}${fill(S.current.title)} → ${fill(c.text)}`, "event");
    renderStats("stats", applied);
    playSound(out.sound || c.sound);

    // 결과 표시
    $("evChoices").style.display = "none";
    $("evResultText").textContent = fill(out.result || "");
    $("evDeltas").innerHTML = Object.entries(applied).filter(([, d]) => d)
      .map(([k, d]) => `<span style="color:${d > 0 ? "#1f9d63" : "#d23c3c"}">${k === "교육" ? "📚 교육 기회 +1" : `${k} ${d > 0 ? "+" : ""}${d}`}</span>`).join("");
    const info = S.current.info;
    $("evInfo").style.display = info ? "block" : "none";
    $("evInfoText").textContent = fill(info || "");
    $("evResult").style.display = "block";
    $("evContinue").onclick = () => closeEvent(out.next || c.next);
  }

  function closeEvent(nextId) {
    $("eventModal").classList.remove("open");
    S.busy = false;
    const next = nextId && EVENTS.find((e) => e.id === nextId);
    if (next) return openEvent(next);
    if (S.age >= SETTINGS.maxAge) ending();
  }

  // ── 엔딩 ──
  function ending() {
    S.busy = true;
    const end = ENDINGS.find((e) => meets(e.requires)) || { title: "끝", text: "" };
    $("endTitle").textContent = fill(end.title);
    $("endText").textContent = fill(end.text);
    renderStats("endStats");
    $("eduList").innerHTML = S.edu.length
      ? S.edu.map((e) => `<li><small>${e.age}세</small>${e.name}</li>`).join("")
      : "<li>받은 교육이 없습니다.</li>";
    show("endScreen");
  }

  // ── 시작 ──
  document.title = SETTINGS.title;
  $("gameTitle").textContent = SETTINGS.title;
  $("gameSubtitle").textContent = SETTINGS.subtitle;
  $("startBtn").onclick = start;
  $("nameInput").onkeydown = (e) => { if (e.key === "Enter") start(); };
  $("skipBtn").onclick = skipToEvent;
  $("restartBtn").onclick = () => { show("startScreen"); $("nameInput").value = ""; };
})();
</script>
