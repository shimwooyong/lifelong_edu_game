<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>배움의 일생</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f3ee;
  --paper: #ffffff;
  --ink: #2b2a28;
  --muted: #8a857c;
  --line: #e7e1d7;
  --accent: #3d5afe;
  --radius: 16px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
@supports (height: 100dvh) { body { height: 100dvh; } }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Noto Sans KR", system-ui, sans-serif;
  line-height: 1.6;
}
.screen { display: none; height: 100%; max-width: 640px; margin: 0 auto; }
.screen.active { display: flex; flex-direction: column; }

/* 버튼 */
.btn {
  font: inherit; font-weight: 500;
  border: 1px solid var(--line); background: var(--paper); color: var(--ink);
  padding: 12px 18px; border-radius: 12px; cursor: pointer;
  transition: transform .1s, background .2s;
}
.btn:hover { background: #faf8f4; }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn.primary:hover { background: #444; }
.btn:disabled { opacity: .4; cursor: default; }

/* 시작 */
#startScreen { justify-content: center; padding: 24px; }
.start-box { text-align: center; display: flex; flex-direction: column; gap: 14px; }
.start-box h1 { font-size: 44px; font-weight: 900; margin: 0; letter-spacing: -1px; }
.subtitle { color: var(--muted); margin: 0 0 20px; }
#nameInput {
  font: inherit; padding: 12px 16px; border-radius: 12px;
  border: 1px solid var(--line); text-align: center; background: var(--paper);
}

/* 상단 */
.top { display: flex; justify-content: space-between; align-items: center; padding: 20px 16px 8px; }
.who { display: flex; align-items: center; gap: 10px; font-size: 18px; }
.tag { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: #eee; }
.age { font-size: 40px; font-weight: 900; line-height: 1; }
.age small { font-size: 16px; font-weight: 500; margin-left: 2px; color: var(--muted); }

/* 능력치 */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 8px 16px; }
.stat { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; position: relative; }
.stat .name { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
.stat .name b { color: var(--ink); }
.stat .bar { height: 6px; background: #f0ece5; border-radius: 99px; margin-top: 6px; overflow: hidden; }
.stat .fill { height: 100%; border-radius: 99px; transition: width .6s ease; }
.float {
  position: absolute; right: 8px; top: -6px; font-size: 12px; font-weight: 700;
  animation: floatUp 1.4s ease forwards; pointer-events: none;
}
@keyframes floatUp { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-18px); } }

/* 인생 진행 막대 */
.timeline-bar { display: flex; gap: 3px; padding: 4px 16px 8px; }
.timeline-bar div { flex: 1; height: 4px; border-radius: 99px; background: #e4ded3; transition: background .4s; }

/* 기록 */
.log { flex: 1; overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 6px; }
.entry { display: flex; gap: 12px; font-size: 15px; animation: fadeIn .4s ease; }
.entry .y { min-width: 40px; color: var(--muted); font-size: 13px; padding-top: 2px; text-align: right; }
.entry.stage { margin-top: 12px; font-weight: 700; }
.entry.event .t { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }

.controls { display: flex; gap: 8px; padding: 12px 16px 20px; }
.controls .btn { flex: 1; white-space: nowrap; }

/* 이벤트 창 */
.modal {
  position: fixed; inset: 0; background: rgba(30, 28, 24, .45);
  display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10;
}
.modal.open { display: flex; }
.card {
  background: var(--paper); border-radius: var(--radius); width: 100%; max-width: 520px;
  max-height: 92vh; overflow-y: auto; padding: 22px; animation: pop .25s ease;
}
@keyframes pop { from { transform: scale(.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.card-head { display: flex; justify-content: space-between; align-items: center; }
.ev-age { color: var(--muted); font-size: 14px; }
.card h2 { margin: 10px 0; font-size: 22px; }
.ev-image { width: 100%; border-radius: 12px; margin-bottom: 10px; display: none; }
.ev-text { white-space: pre-line; margin: 0 0 16px; }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choices .btn { text-align: left; }
.result { display: none; }
.deltas { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.deltas span { font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: #f3f0ea; }
.info { background: #f2f5ff; border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; font-size: 14px; }
.info p { white-space: pre-line; margin: 6px 0 0; }
#evContinue { width: 100%; }

/* 엔딩 */
#endScreen { overflow-y: auto; }
.end-box { padding: 32px 16px; text-align: center; }
.end-label { color: var(--muted); margin: 0; }
.end-box h2 { font-size: 32px; margin: 4px 0 12px; }
.end-text { white-space: pre-line; }
.end-box h3 { margin-top: 24px; }
.edu-list { list-style: none; padding: 0; text-align: left; margin-bottom: 24px; }
.edu-list li { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin-bottom: 6px; }
.edu-list li small { color: var(--muted); margin-right: 8px; }

@media (max-width: 420px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .start-box h1 { font-size: 36px; }
}
</style>
</head>
<body>
  <!-- 시작 화면 -->
  <section id="startScreen" class="screen active">
    <div class="start-box">
      <h1 id="gameTitle"></h1>
      <p id="gameSubtitle" class="subtitle"></p>
      <input id="nameInput" maxlength="8" placeholder="이름을 입력하세요 (비우면 무작위)">
      <button id="startBtn" class="btn primary">인생 시작하기</button>
    </div>
  </section>

  <!-- 게임 화면 -->
  <section id="gameScreen" class="screen">
    <header class="top">
      <div class="who">
        <span id="stageTag" class="tag"></span>
        <strong id="nameText"></strong>
      </div>
      <div class="age"><span id="ageText">0</span><small>세</small></div>
    </header>
    <div id="stats" class="stats"></div>
    <div id="timelineBar" class="timeline-bar"></div>
    <main id="log" class="log"></main>
    <footer class="controls">
      <button id="nextBtn" class="btn primary">▶ 1년 보내기</button>
      <button id="skipBtn" class="btn">⏩ 다음 이벤트</button>
    </footer>
  </section>

  <!-- 엔딩 화면 -->
  <section id="endScreen" class="screen">
    <div class="end-box">
      <p class="end-label">인생의 끝에서</p>
      <h2 id="endTitle"></h2>
      <p id="endText" class="end-text"></p>
      <div id="endStats" class="stats"></div>
      <h3>나의 평생교육 이력</h3>
      <ul id="eduList" class="edu-list"></ul>
      <button id="restartBtn" class="btn primary">다시 태어나기</button>
    </div>
  </section>

  <!-- 이벤트 창 -->
  <div id="eventModal" class="modal">
    <div class="card">
      <div class="card-head">
        <span id="evStage" class="tag"></span>
        <span id="evAge" class="ev-age"></span>
      </div>
      <h2 id="evTitle"></h2>
      <img id="evImage" class="ev-image" alt="">
      <p id="evText" class="ev-text"></p>
      <div id="evChoices" class="choices"></div>
      <div id="evResult" class="result">
        <p id="evResultText" class="ev-text"></p>
        <div id="evDeltas" class="deltas"></div>
        <div id="evInfo" class="info">
          <strong>📚 평생교육 알아보기</strong>
          <p id="evInfoText"></p>
        </div>
        <button id="evContinue" class="btn primary">계속</button>
      </div>
    </div>
  </div>

  <!-- 게임 데이터: 새 스크립트 파일은 여기에 추가 -->

<script>
// 게임 엔진: 데이터(data 폴더)를 읽어 게임을 진행한다
(() => {
  const $ = (id) => document.getElementById(id);
  const S = {}; // 현재 게임 상태
  let bgm = null;

  // ── 유틸 ──
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const clamp = (v) => Math.max(0, Math.min(100, v));
  const stageOf = (age) => STAGES.find((s) => age >= s.from && age <= s.to) || STAGES[STAGES.length - 1];

  // {이름}과 조사 처리: {이름}이(가), 은(는), 을(를), 과(와), 아(야), 으로(로)
  function fill(text) {
    const name = S.name || "";
    const last = name.charCodeAt(name.length - 1);
    const hasBatchim = last >= 0xac00 && last <= 0xd7a3 && (last - 0xac00) % 28 !== 0;
    const josa = { "이(가)": ["이", "가"], "은(는)": ["은", "는"], "을(를)": ["을", "를"],
      "과(와)": ["과", "와"], "아(야)": ["아", "야"], "으로(로)": ["으로", "로"] };
    return (text || "")
      .replace(/\{이름\}(이\(가\)|은\(는\)|을\(를\)|과\(와\)|아\(야\)|으로\(로\))/g,
        (_, j) => name + josa[j][hasBatchim ? 0 : 1])
      .replace(/\{이름\}/g, name);
  }

  // 조건 검사: { min:{지식:50}, max:{...}, flags:[...], notFlags:[...], eduCount:3 }
  function meets(req) {
    if (!req) return true;
    for (const k in req.min || {}) if (S.stats[k] < req.min[k]) return false;
    for (const k in req.max || {}) if (S.stats[k] > req.max[k]) return false;
    for (const f of req.flags || []) if (!S.flags[f]) return false;
    for (const f of req.notFlags || []) if (S.flags[f]) return false;
    if (req.eduCount && S.edu.length < req.eduCount) return false;
    return true;
  }

  function playSound(src) {
    if (!src) return;
    try { new Audio(src).play(); } catch (e) {}
  }

  // ── 화면 ──
  function show(id) {
    document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active"));
    $(id).classList.add("active");
  }

  function renderStats(target, withFloat = {}) {
    const box = $(target);
    box.innerHTML = "";
    for (const k of SETTINGS.stats) {
      const v = S.stats[k], c = SETTINGS.statColors[k] || "#888";
      const d = withFloat[k];
      box.insertAdjacentHTML("beforeend", `
        <div class="stat">
          <div class="name">${k}<b>${v}</b></div>
          <div class="bar"><div class="fill" style="width:${v}%;background:${c}"></div></div>
          ${d ? `<span class="float" style="color:${d > 0 ? "#2fb47c" : "#e5484d"}">${d > 0 ? "+" : ""}${d}</span>` : ""}
        </div>`);
    }
  }

  function renderTop() {
    const st = stageOf(S.age);
    $("ageText").textContent = S.age;
    $("nameText").textContent = S.name;
    $("stageTag").textContent = st.id;
    $("stageTag").style.background = st.color;
    // 인생 진행 막대
    const bar = $("timelineBar");
    bar.innerHTML = STAGES.map((s) =>
      `<div style="background:${S.age >= s.from ? s.color : ""}" title="${s.id}"></div>`).join("");
  }

  function log(text, type = "", age = S.age) {
    const el = document.createElement("div");
    el.className = "entry " + type;
    el.innerHTML = `<span class="y">${type === "stage" ? "" : age + "세"}</span><span class="t"></span>`;
    el.querySelector(".t").textContent = fill(text);
    $("log").appendChild(el);
    $("log").scrollTop = $("log").scrollHeight;
  }

  // ── 진행 ──
  function start() {
    Object.assign(S, {
      name: $("nameInput").value.trim() || pick(SETTINGS.randomNames),
      age: 0,
      stats: { ...SETTINGS.startStats },
      flags: {}, done: {}, edu: [],
      stage: null, busy: false,
    });
    $("log").innerHTML = "";
    show("gameScreen");
    renderTop();
    renderStats("stats");
    S.stage = stageOf(0).id;
    log(`── ${S.stage} ──`, "stage");
    log("{이름}이(가) 태어났다.");
    if (SETTINGS.bgm && !bgm) { bgm = new Audio(SETTINGS.bgm); bgm.loop = true; bgm.play().catch(() => {}); }
  }

  function findEvent() {
    return EVENTS.find((e) => {
      if (S.done[e.id]) return false;
      const ageOk = e.age != null ? e.age === S.age
        : e.ages ? S.age >= e.ages[0] && S.age <= e.ages[1] : false;
      if (!ageOk || !meets(e.requires)) return false;
      return e.chance == null || Math.random() < e.chance;
    });
  }

  // 1년 진행. 이벤트가 열리면 true 반환
  function nextYear(quiet = false) {
    if (S.busy) return true;
    if (S.age >= SETTINGS.maxAge) { ending(); return true; }
    S.age++;
    const st = stageOf(S.age);
    if (st.id !== S.stage) { S.stage = st.id; log(`── ${st.id} ──`, "stage"); }
    renderTop();
    const ev = findEvent();
    if (ev) { openEvent(ev); return true; }
    if (!quiet && st.lines && st.lines.length) log(pick(st.lines));
    if (S.age >= SETTINGS.maxAge) { ending(); return true; }
    return false;
  }

  function skipToEvent() {
    while (!nextYear(true)) {}
  }

  // ── 이벤트 ──
  function openEvent(ev) {
    S.busy = true;
    S.current = ev;
    S.done[ev.id] = true;
    const st = stageOf(S.age);
    $("evStage").textContent = st.id;
    $("evStage").style.background = st.color;
    $("evAge").textContent = S.age + "세";
    $("evTitle").textContent = fill(ev.title);
    $("evText").textContent = fill(ev.text);
    const img = $("evImage");
    if (ev.image) { img.src = ev.image; img.style.display = "block"; } else img.style.display = "none";
    playSound(ev.sound);

    const box = $("evChoices");
    box.innerHTML = "";
    box.style.display = "flex";
    $("evResult").style.display = "none";
    ev.choices.filter((c) => meets(c.requires)).forEach((c) => {
      const b = document.createElement("button");
      b.className = "btn";
      b.textContent = fill(c.text);
      b.onclick = () => choose(c);
      box.appendChild(b);
    });
    $("eventModal").classList.add("open");
  }

  function choose(c) {
    // 확률 결과가 있으면 하나를 고른다
    let out = c;
    if (c.outcomes) {
      let r = Math.random(), acc = 0;
      out = c.outcomes[c.outcomes.length - 1];
      for (const o of c.outcomes) { acc += o.chance; if (r < acc) { out = o; break; } }
    }
    const effects = out.effects || {};
    const applied = {};
    for (const k in effects) {
      const before = S.stats[k];
      S.stats[k] = clamp(before + effects[k]);
      applied[k] = S.stats[k] - before;
    }
    for (const f of [].concat(c.flags || [], out.flags || [])) S.flags[f] = true;
    const eduName = out.edu !== undefined ? out.edu : c.edu;
    if (eduName) S.edu.push({ age: S.age, name: fill(eduName) });

    log(`${fill(S.current.title)} → ${fill(c.text)}`, "event");
    renderStats("stats", applied);
    playSound(out.sound || c.sound);

    // 결과 표시
    $("evChoices").style.display = "none";
    $("evResultText").textContent = fill(out.result || "");
    $("evDeltas").innerHTML = Object.entries(applied).filter(([, d]) => d)
      .map(([k, d]) => `<span style="color:${d > 0 ? "#1f9d63" : "#d23c3c"}">${k} ${d > 0 ? "+" : ""}${d}</span>`).join("");
    const info = S.current.info;
    $("evInfo").style.display = info ? "block" : "none";
    $("evInfoText").textContent = fill(info || "");
    $("evResult").style.display = "block";
    $("evContinue").onclick = () => closeEvent(out.next || c.next);
  }

  function closeEvent(nextId) {
    $("eventModal").classList.remove("open");
    S.busy = false;
    const next = nextId && EVENTS.find((e) => e.id === nextId);
    if (next) return openEvent(next);
    if (S.age >= SETTINGS.maxAge) ending();
  }

  // ── 엔딩 ──
  function ending() {
    S.busy = true;
    const end = ENDINGS.find((e) => meets(e.requires)) || { title: "끝", text: "" };
    $("endTitle").textContent = fill(end.title);
    $("endText").textContent = fill(end.text);
    renderStats("endStats");
    $("eduList").innerHTML = S.edu.length
      ? S.edu.map((e) => `<li><small>${e.age}세</small>${e.name}</li>`).join("")
      : "<li>받은 교육이 없습니다.</li>";
    show("endScreen");
  }

  // ── 시작 ──
  document.title = SETTINGS.title;
  $("gameTitle").textContent = SETTINGS.title;
  $("gameSubtitle").textContent = SETTINGS.subtitle;
  $("startBtn").onclick = start;
  $("nameInput").onkeydown = (e) => { if (e.key === "Enter") start(); };
  $("nextBtn").onclick = () => nextYear();
  $("skipBtn").onclick = skipToEvent;
  $("restartBtn").onclick = () => { show("startScreen"); $("nameInput").value = ""; };
})();
</script>
</body>
</html>
