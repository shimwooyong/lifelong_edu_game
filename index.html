<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>배움의 일생</title>
  <link href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=1794905875">
  <link rel="stylesheet" href="css/multi.css?v=1794905875">
</head>
<body>
  <!-- 조 고르기 -->
  <section id="lobby" class="screen active">
    <div class="pad">
      <img id="lobbyArt" class="banner-art" alt="">
      <h1 class="logo">배움의 일생</h1>
      <p class="subtitle">우리 조(가족)를 골라 입장하세요</p>
      <div id="groupList" class="group-grid"></div>
      <p id="lobbyMsg" class="muted center"></p>
    </div>
  </section>

  <!-- 역할 고르기 -->
  <section id="join" class="screen">
    <div class="pad">
      <button id="backBtn" class="link">← 조 목록</button>
      <h2 id="joinTitle"></h2>
      <input id="playerName" maxlength="8" placeholder="내 이름">
      <p class="muted">맡을 역할을 고르세요</p>
      <div id="seatList" class="seat-grid"></div>
    </div>
  </section>

  <!-- 대기 -->
  <section id="wait" class="screen">
    <div class="pad center">
      <h2 id="waitTitle"></h2>
      <div id="waitSeats" class="seat-grid"></div>
      <p class="muted">4명이 모두 들어오면 선생님이 게임을 시작합니다.</p>
      <button id="leaveBtn" class="link">나가기</button>
    </div>
  </section>

  <!-- 게임 -->
  <section id="gameScreen" class="screen">
    <header class="top">
      <div class="who">
        <img id="childSprite" class="sprite" alt="">
        <span id="stageTag" class="tag"></span>
        <strong id="childName"></strong>
        <span id="myRole" class="tag me"></span>
      </div>
      <div class="ages">
        <div class="year-box"><span id="yearText">2026</span><small>년</small></div>
        <div class="age"><small>자녀</small><span id="childAge">0</span><small>세</small></div>
        <div class="age sub-age"><small>부모</small><span id="parentAge">30</span><small>세</small></div>
      </div>
    </header>
    <div id="stats" class="stats"></div>
    <div id="timelineBar" class="timeline-bar"></div>
    <main id="log" class="log"></main>
    <div id="statusLine" class="status-line"></div>
    <footer class="controls">
      <button id="nextBtn" class="btn primary">▶ 다음 이벤트</button>
    </footer>
  </section>

  <!-- 엔딩 -->
  <section id="endScreen" class="screen">
    <div class="end-box">
      <p class="end-label">자녀가 60세가 되었습니다</p>
      <h2 id="endTitle"></h2>
      <p id="endText" class="end-text"></p>
      <div id="endStats" class="stats"></div>
      <h3>우리 가족이 배운 이유</h3>
      <div id="endMotive" class="motive"></div>
      <h3>우리 가족이 겪은 뉴스</h3>
      <ul id="endNews" class="edu-list news-list"></ul>
      <h3>자녀의 평생교육 이력</h3>
      <ul id="eduChild" class="edu-list"></ul>
      <h3>부모님의 평생교육 이력</h3>
      <ul id="eduParent" class="edu-list"></ul>
    </div>
  </section>

  <!-- 이벤트 창 -->
  <div id="eventModal" class="modal">
    <div class="card">
      <div class="card-head">
        <span id="evStage" class="tag"></span>
        <span id="evAge" class="ev-age"></span>
      </div>
      <h2 id="evTitle"></h2>
      <img id="evImage" class="ev-image" alt="">
      <p id="evText" class="ev-text"></p>
      <div id="evChoices" class="choices"></div>
      <p id="evMsg" class="ev-msg"></p>
      <div id="evResult" class="result">
        <p id="evResultText" class="ev-text"></p>
        <div id="evDeltas" class="deltas"></div>
        <div id="evInfo" class="info">
          <strong>📚 평생교육 알아보기</strong>
          <p id="evInfoText"></p>
        </div>
        <button id="evContinue" class="btn primary">계속</button>
      </div>
    </div>
  </div>

  <!-- 브레이킹 뉴스 -->
  <div id="breaking" class="breaking">
    <div class="bk-flash"></div>
    <div class="bk-stripes"></div>
    <div class="bk-box">
      <div class="bk-top">
        <span class="bk-label"><span class="bk-dot"></span>속보</span>
        <span class="bk-en">BREAKING NEWS</span>
        <span id="bkLive" class="bk-live">● LIVE</span>
      </div>
      <img id="bkArt" class="bk-art" alt="">
      <div id="bkDate" class="bk-date"></div>
      <h1 id="bkHead" class="bk-head"></h1>
      <div class="bk-changes-title">▼ 이 뉴스로 바뀌는 세상</div>
      <ul id="bkChanges" class="bk-changes"></ul>
      <div id="bkShock" class="bk-shock"></div>
      <button id="bkClose" class="btn bk-btn">확인했어요</button>
      <p id="bkWait" class="bk-wait">앵커의 뉴스를 들어 주세요…</p>
    </div>
    <div class="bk-stripes bottom"></div>
    <div class="bk-ticker"><span class="bk-tk-label">속보</span><div class="bk-tk-track"><div id="bkTicker" class="bk-tk-text"></div></div></div>
  </div>

  <!-- 서버 -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js?v=1794905875"></script>
  <script src="js/net.js?v=1794905875"></script>
  <!-- 게임 데이터: 새 스크립트 파일은 여기와 admin.html, 혼자하기.html에 추가 -->
  <script src="data/settings.js?v=1794905875"></script>
  <script src="data/stages.js?v=1794905875"></script>
  <script src="data/events.js?v=1794905875"></script>
  <script src="data/events_more.js?v=1794905875"></script>
  <script src="data/events_random.js?v=1794905875"></script>
  <script src="data/events_stage.js?v=1794905875"></script>
  <script src="data/events_late.js?v=1794905875"></script>
  <script src="data/news.js?v=1794905875"></script>
  <script src="data/endings.js?v=1794905875"></script>
  <script src="data/glossary.js?v=1794905875"></script>
  <script src="js/help.js?v=1794905875"></script>
  <!-- 게임 -->
  <script src="js/logic.js?v=1794905875"></script>
  <script src="js/pixel.js?v=1794905875"></script>
  <script src="js/breaking.js?v=1794905875"></script>
  <script src="js/bgm.js?v=1794905875"></script>
  <script src="js/player.js?v=1794905875"></script>
</body>
</html>
