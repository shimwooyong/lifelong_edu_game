<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>배움의 일생</title>
  <link href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=1795431244">
  <link rel="stylesheet" href="css/multi.css?v=1795431244">
  <style>body.solo .stats { grid-template-columns: repeat(2, 1fr); }</style>
</head>
<body class="solo">
  <!-- 시작 화면 -->
  <section id="startScreen" class="screen active">
    <div class="start-box">
      <img id="lobbyArt" class="banner-art" alt="">
      <h1 id="gameTitle"></h1>
      <p id="gameSubtitle" class="subtitle"></p>
      <input id="nameInput" maxlength="8" placeholder="이름을 입력하세요 (비우면 무작위)">
      <button id="startBtn" class="btn primary">인생 시작하기</button>
    </div>
  </section>

  <!-- 게임 화면 -->
  <section id="gameScreen" class="screen">
    <header class="top">
      <div class="who">
        <span id="stageTag" class="tag"></span>
        <strong id="nameText"></strong>
      </div>
      <div class="age"><span id="ageText">0</span><small>세</small></div>
    </header>
    <div id="stats" class="stats"></div>
    <div id="timelineBar" class="timeline-bar"></div>
    <main id="log" class="log"></main>
    <footer class="controls">
      <button id="skipBtn" class="btn primary">▶ 다음 이벤트</button>
    </footer>
  </section>

  <!-- 엔딩 화면 -->
  <section id="endScreen" class="screen">
    <div class="end-box">
      <p class="end-label">인생의 끝에서</p>
      <h2 id="endTitle"></h2>
      <p id="endText" class="end-text"></p>
      <div id="endStats" class="stats"></div>
      <h3>나의 평생교육 이력</h3>
      <ul id="eduList" class="edu-list"></ul>
      <button id="restartBtn" class="btn primary">다시 태어나기</button>
    </div>
  </section>

  <!-- 이벤트 창 -->
  <div id="eventModal" class="modal">
    <div class="card">
      <div class="card-head">
        <span id="evStage" class="tag"></span>
        <span id="evAge" class="ev-age"></span>
      </div>
      <h2 id="evTitle"></h2>
      <img id="evImage" class="ev-image" alt="">
      <p id="evText" class="ev-text"></p>
      <div id="evChoices" class="choices"></div>
      <div id="evResult" class="result">
        <p id="evResultText" class="ev-text"></p>
        <div id="evDeltas" class="deltas"></div>
        <div id="evInfo" class="info">
          <strong>📚 평생교육 알아보기</strong>
          <p id="evInfoText"></p>
        </div>
        <button id="evContinue" class="btn primary">계속</button>
      </div>
    </div>
  </div>

  <!-- 브레이킹 뉴스 -->
  <div id="breaking" class="breaking">
    <div class="bk-flash"></div>
    <div class="bk-stripes"></div>
    <div class="bk-box">
      <div class="bk-top">
        <span class="bk-label"><span class="bk-dot"></span>속보</span>
        <span class="bk-en">BREAKING NEWS</span>
        <span id="bkLive" class="bk-live">● LIVE</span>
      </div>
      <img id="bkArt" class="bk-art" alt="">
      <div id="bkDate" class="bk-date"></div>
      <h1 id="bkHead" class="bk-head"></h1>
      <div class="bk-changes-title">▼ 이 뉴스로 바뀌는 세상</div>
      <ul id="bkChanges" class="bk-changes"></ul>
      <div id="bkShock" class="bk-shock"></div>
      <button id="bkClose" class="btn bk-btn">확인했어요</button>
      <p id="bkWait" class="bk-wait">진행자의 속보 발표를 들어 주세요…</p>
    </div>
    <div class="bk-stripes bottom"></div>
    <div class="bk-ticker"><span class="bk-tk-label">속보</span><div class="bk-tk-track"><div id="bkTicker" class="bk-tk-text"></div></div></div>
  </div>
  <!-- 게임 데이터: 새 스크립트 파일은 여기에 추가 -->
  <script src="data/settings.js?v=1795431244"></script>
  <script src="data/stages.js?v=1795431244"></script>
  <script src="data/events.js?v=1795431244"></script>
  <script src="data/events_more.js?v=1795431244"></script>
  <script src="data/events_random.js?v=1795431244"></script>
  <script src="data/events_stage.js?v=1795431244"></script>
  <script src="data/news.js?v=1795431244"></script>
  <script src="data/endings.js?v=1795431244"></script>
  <script src="data/glossary.js?v=1795431244"></script>
  <script>window.HELP_MODE = "solo";</script>
  <script src="js/help.js?v=1795431244"></script>
  <script src="js/breaking.js?v=1795431244"></script>
  <script src="js/bgm.js?v=1795431244"></script>
  <!-- 게임 엔진 -->
  <script src="js/pixel.js?v=1795431244"></script>
  <script src="js/engine.js?v=1795431244"></script>
  <script>
  // 새 버전이 올라왔는데 브라우저가 예전 페이지를 기억하고 있으면, 새 페이지로 바로 바꿔 줌
  (function () {
    var m = document.documentElement.innerHTML.match(/\?v=(\d+)/); if (!m) return;
    fetch(location.pathname + "?nc=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.text(); }).then(function (t) {
      var n = (t.match(/\?v=(\d+)/) || [])[1];
      if (!n || n === m[1]) return;
      var u = new URL(location.href); if (u.searchParams.get("r") === n) return;
      u.searchParams.set("r", n); location.replace(u.toString());
    }).catch(function () {});
  })();
  </script>
</body>
</html>
